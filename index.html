<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bedrijfseconomie">
<meta name="theme-color" content="#f08a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>Bedrijfseconomie havo/vwo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23f08a09'/><path d='M28 28 L50 74 L72 28' fill='none' stroke='white' stroke-width='12' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<style>
/* ===== Vellesan College huisstijl: oranje #F08A09, antraciet #171C24, Raleway =====
   Layout geïnspireerd op moderne nieuws-, shop- en sportdashboards: witte topnavigatie,
   grote fotokoppen met donkere overlay, fotokaarten en een dashboard in kolommen. */
:root{--bg:#f4f4f2;--kaart:#ffffff;--ink:#171c24;--zacht:#626873;--lijn:#e5e3df;--acc:#f08a09;--knop:#e47f00;--donker:#171c24;--goed:#1f9e6e;--fout:#d6453d;--goud:#d9a521;--r:10px;
  --schaduw:0 1px 2px rgba(23,28,36,.05),0 1px 0 rgba(23,28,36,.03);--kop:"Raleway","Helvetica Neue",Helvetica,Arial,sans-serif;--tekst:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.th-nacht{--bg:#12161d;--kaart:#1d232c;--ink:#eef0f4;--zacht:#a7afbf;--lijn:#2f3744;--donker:#0b0e13}
body.th-zee{--acc:#1b8fb0;--knop:#167b98}
body.th-bos{--acc:#3f8f3a;--knop:#367c32}
body.th-snoep{--acc:#d64f8f;--knop:#c2407e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--tekst);-webkit-text-size-adjust:100%;font-variant-numeric:lining-nums}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.sectie,.knop,.chip,.getal,.eyebrow{font-family:var(--kop);font-variant-numeric:lining-nums}
h1,h2,h3{letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--knop)}

/* ---------- topnavigatie ---------- */
.topnav{background:var(--kaart);border-bottom:1px solid var(--lijn);position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.topnav .rij1{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.logo svg{width:40px;height:40px;flex:none}
.logo .lw{display:flex;flex-direction:column;line-height:1}
.logo .lw b{font:800 23px/1 var(--kop);color:#4a4d52;letter-spacing:-.02em}
body.th-nacht .logo .lw b{color:#e8eaee}
.logo .lw small{font:700 11px/1.2 var(--kop);color:var(--acc);letter-spacing:.18em;margin-top:3px}
.logo .vak{font:700 14px/1.2 var(--kop);color:var(--zacht);border-left:1px solid var(--lijn);padding-left:12px;margin-left:4px}
.topnav .rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.profiel{display:flex;align-items:center;gap:10px;border:2px solid var(--acc);border-radius:8px;background:none;padding:5px 12px 5px 5px;color:var(--knop);font:700 15px var(--kop);max-width:240px}
.profiel span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:6px;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 14px var(--kop);flex:none}
.ikoonknop{border:0;background:var(--acc);color:#fff;border-radius:8px;height:44px;padding:0 16px;font:800 14px var(--kop);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.topnav .rij2{border-top:1px solid var(--lijn)}
.menu{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{border:0;background:none;border-radius:999px;padding:9px 18px;font:600 16px var(--tekst);color:var(--ink);white-space:nowrap}
.menu button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.menu button.aan{background:var(--donker);color:#fff}
body.th-nacht .menu button.aan{background:var(--acc)}
body[data-scherm=quiz] .rij2,body[data-scherm=welkom] .rij2,body[data-scherm=quiz] .rechts,body[data-scherm=welkom] .rechts{display:none}
body[data-scherm=quiz] .topnav{position:static}

/* ---------- algemene layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 60px}
.wrap.smal{max-width:820px}
.sectie{display:flex;align-items:baseline;gap:12px;margin:36px 0 16px;font-size:24px;font-weight:800;color:var(--ink)}
.sectie .meer{margin-left:auto;font:600 15px var(--tekst);color:var(--zacht);border:0;background:none;padding:0}
.sectie:first-child{margin-top:0}
.kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:22px;box-shadow:var(--schaduw)}
.kaart h3{font-size:20px;font-weight:800}
.zacht{color:var(--zacht)}
.mid{text-align:center}
.groot{font-size:56px;text-align:center;margin:6px 0}
.eyebrow{display:inline-block;font:800 13px/1 var(--kop);letter-spacing:.12em;text-transform:uppercase}

/* ---------- foto-koppen ---------- */
.foto{position:relative;background:#2b313b center/cover no-repeat;color:#fff;overflow:hidden}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,18,24,.82) 0%,rgba(15,18,24,.55) 45%,rgba(15,18,24,.15) 100%);pointer-events:none}
.foto>*{position:relative;z-index:1}
.held{min-height:440px;display:flex;align-items:center}
.held .in{max-width:1240px;width:100%;margin:0 auto;padding:56px 24px;display:flex;gap:40px;align-items:center}
.held h1{font:800 54px/1.05 var(--kop);text-transform:uppercase;margin:12px 0 16px;max-width:760px;letter-spacing:-.01em}
.held p{font-size:19px;max-width:600px;margin:0 0 26px;opacity:.95}
.held .eyebrow{color:var(--acc)}
.usp{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px 26px;font-weight:600;font-size:16px}
.usp li::before{content:"✓";color:var(--acc);font-weight:900;margin-right:8px}
.paneel{flex:none;width:300px;background:rgba(40,44,52,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r);overflow:hidden;align-self:stretch;max-height:340px}
.paneel h4{margin:0;padding:16px 20px;background:rgba(255,255,255,.12);font:800 15px var(--kop);text-transform:uppercase;letter-spacing:.06em}
.paneel button{display:flex;gap:10px;width:100%;border:0;background:none;color:#fff;text-align:left;padding:11px 20px;font-size:16px;opacity:.92}
.paneel button:hover{background:rgba(255,255,255,.08)}
.paneel button span:first-child{width:22px;text-align:center}
.paginakop{border-radius:var(--r);min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 26px;margin-bottom:26px}
.paginakop::after{background:linear-gradient(0deg,rgba(15,18,24,.85) 0%,rgba(15,18,24,.35) 70%,rgba(15,18,24,.2) 100%)}
.paginakop h1{font:800 36px/1.1 var(--kop);margin:4px 0 0}
.paginakop .bovenin{position:absolute;top:16px;left:22px;right:22px;display:flex;gap:8px;align-items:center}
.paginakop .bovenin .chip:first-of-type{margin-left:auto}
.terug{border:0;background:none;color:var(--knop);font:700 16px var(--kop);padding:6px 4px 6px 0}
.foto .terug{color:#fff;background:rgba(0,0,0,.3);border-radius:999px;padding:7px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--kaart);border:1px solid var(--lijn);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px}
.foto .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* oude kop (fallback) */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:800 26px/1.2 var(--kop);margin:0;flex:1;min-width:200px}

/* ---------- knoppen ---------- */
.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:13px 24px;font-weight:800;background:var(--knop);color:#fff;font-size:16px;letter-spacing:.03em;min-height:50px;transition:filter .1s,transform .05s}
.knop:hover{filter:brightness(1.06)}
.knop:active{transform:translateY(1px)}
.knop.groot{font-size:18px;padding:16px 32px;text-transform:uppercase;letter-spacing:.05em}
.knop.zacht{background:var(--kaart);color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 22%,var(--lijn))}
.knop.rand{background:transparent;color:var(--knop);border:2px solid var(--knop)}
.knop.vol{width:100%}
.knop:disabled{opacity:.45}
.knop.klein{min-height:40px;padding:8px 14px;font-size:14px}

/* ---------- dashboard (startpagina) ---------- */
.dash{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:28px;align-items:start}
.dash>aside{display:flex;flex-direction:column;gap:22px}
.profielkaart{padding:0;overflow:hidden;text-align:center}
.profielkaart .bg{height:70px;background:linear-gradient(120deg,var(--knop),var(--acc))}
.profielkaart .avatar{width:84px;height:84px;font-size:32px;border-radius:14px;margin:-42px auto 10px;border:4px solid var(--kaart);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.profielkaart h2{margin:0;font-size:24px;font-weight:800}
.profielkaart .klas{color:var(--zacht);font-size:15px;margin:2px 0 14px}
.cijfers{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--lijn);border-bottom:1px solid var(--lijn)}
.cijfers div{padding:14px 6px}
.cijfers div+div{border-left:1px solid var(--lijn)}
.cijfers small{display:block;color:var(--zacht);font-size:13px}
.getal{font:700 28px/1.15 var(--tekst);letter-spacing:-.01em}
.profielkaart .blok{text-align:left;padding:16px 20px;border-bottom:1px solid var(--lijn)}
.profielkaart .blok:last-child{border-bottom:0}
.profielkaart .blok>small{display:block;color:var(--zacht);font-size:14px;margin-bottom:8px}
.streak{display:flex;align-items:flex-end;gap:6px}
.streak .vlam{text-align:center;color:var(--acc);font:800 12px/1.1 var(--kop);min-width:38px}
.streak .vlam b{display:block;font-size:24px}
.dagen{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;flex:1;text-align:center;font-size:12px;color:var(--zacht)}
.dagen i{display:grid;place-items:center;width:26px;height:26px;margin:4px auto 0;border-radius:50%;border:1px solid var(--lijn);font-style:normal;font-size:12px;color:var(--ink)}
.dagen i.ja{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:800}
.dagen i.nu{border:2px solid var(--ink)}
.linkrij{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:16px 20px;color:var(--knop);font-weight:700;font-size:16px}
.mijlpaal b{font-family:var(--kop);font-size:18px}

.uitgelicht{border-radius:var(--r);min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;cursor:pointer;border:0;width:100%;text-align:left}
.uitgelicht::after{background:linear-gradient(0deg,rgba(15,18,24,.9) 0%,rgba(15,18,24,.45) 55%,rgba(15,18,24,.05) 100%)}
.uitgelicht .eyebrow{color:var(--acc)}
.uitgelicht h2{font:800 34px/1.12 var(--kop);margin:8px 0 6px}
.uitgelicht p{margin:0 0 18px;opacity:.92;font-size:17px}
.uitgelicht .knop{align-self:flex-start;text-transform:uppercase}

.fotogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.fotokaart{border-radius:var(--r);min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;border:0;text-align:left;width:100%;transition:transform .15s,box-shadow .15s}
.fotokaart::after{background:linear-gradient(0deg,rgba(15,18,24,.92) 0%,rgba(15,18,24,.5) 50%,rgba(15,18,24,.08) 100%)}
.fotokaart:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(23,28,36,.18)}
.fotokaart:active{transform:scale(.985)}
.fotokaart .nr{position:absolute;top:14px;left:14px;background:var(--k,var(--acc));color:#fff;font:800 12px/1 var(--kop);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:5px}
.fotokaart .status{position:absolute;top:12px;right:12px;font-size:22px}
.fotokaart h3{font:800 20px/1.2 var(--kop);margin:0 0 4px}
.fotokaart p{margin:0 0 10px;font-size:14px;opacity:.88}
.fotokaart .balk{background:rgba(255,255,255,.25)}
.fotokaart .balk>i{background:var(--acc)}
.fotokaart.dicht{filter:grayscale(1);opacity:.6}

.zijkop{font:800 22px var(--kop);margin:0 0 14px}
.uitdaging{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px 0;border-bottom:1px solid var(--lijn)}
.uitdaging:last-of-type{border-bottom:0}
.uitdaging .thumb{width:62px;height:62px;border-radius:8px;flex:none;background:#2b313b center/cover;display:grid;place-items:center;font-size:26px;color:#fff;position:relative;overflow:hidden}
.uitdaging .thumb::after{content:"";position:absolute;inset:0;background:rgba(15,18,24,.25)}
.uitdaging .thumb span{position:relative;z-index:1}
.uitdaging b{display:block;font:700 17px/1.25 var(--kop)}
.uitdaging small{color:var(--zacht);font-size:14px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badges span{aspect-ratio:1;display:grid;place-items:center;font-size:28px;border-radius:10px;background:color-mix(in srgb,var(--acc) 12%,var(--kaart));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--lijn))}
.badges span.nee{filter:grayscale(1);opacity:.35;background:var(--bg);border-color:var(--lijn)}

/* ---------- hoofdstukpagina ---------- */
.statstrook{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);margin:-46px auto 0;position:relative;z-index:2;box-shadow:0 8px 24px rgba(23,28,36,.08)}
.statstrook div{padding:18px 22px}
.statstrook div+div{border-left:1px solid var(--lijn)}
.statstrook small{display:block;color:var(--zacht);font-size:14px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.levelkaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--schaduw);border-top:4px solid var(--k,var(--acc));min-height:170px}
.levelkaart:hover{box-shadow:0 10px 24px rgba(23,28,36,.10)}
.levelkaart .boven{display:flex;justify-content:space-between;align-items:center;font:800 12px var(--kop);letter-spacing:.08em;text-transform:uppercase;color:var(--zacht)}
.levelkaart .boven span:last-child{font-size:26px;letter-spacing:0}
.levelkaart h3{margin:2px 0 0;font-size:19px;font-weight:800}
.levelkaart p{margin:0;color:var(--zacht);font-size:15px}
.levelkaart .onder{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;font-weight:700;color:var(--knop);font-size:15px}
.levelkaart.dicht{opacity:.55}
.toetsblok{display:flex;gap:22px;align-items:center;background:var(--donker);color:#fff;border-radius:var(--r);padding:26px;margin-top:18px}
.toetsblok .ic{font-size:46px}
.toetsblok h3{margin:0;font:800 22px var(--kop)}
.toetsblok p{margin:4px 0 0;color:#c9ced6}

/* ---------- lijsten en tegels (overige pagina's) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tegel{position:relative;background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:18px;text-align:left;box-shadow:var(--schaduw);min-height:130px;display:flex;flex-direction:column;gap:6px}
.tegel .ic{font-size:28px}
.tegel h3{margin:4px 0 0;font-size:18px;font-weight:800}
.tegel p{margin:0;color:var(--zacht);font-size:14px}
.balk{height:8px;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:99px;overflow:hidden}
.balk>i{display:block;height:100%;background:var(--k,var(--acc));border-radius:99px}
.rij{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--lijn)}
.rij:last-child{border-bottom:0}
.lv{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--lijn)}
.lv:hover{background:color-mix(in srgb,var(--acc) 5%,var(--kaart))}
.lv:last-child{border-bottom:0}
.lv .med{font-size:28px;width:40px;text-align:center}
.lv b{display:block;font-family:var(--kop);font-weight:700}
.lv small{color:var(--zacht)}
.domein{display:grid;grid-template-columns:34px 1fr 52px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--lijn)}
.domein:last-child{border-bottom:0}
.pct{font-weight:800;text-align:right;font-family:var(--kop)}
.kaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.bk{border-radius:var(--r);padding:14px;min-height:110px;background:var(--kaart);border:1px solid var(--lijn);border-top:3px solid var(--acc);font-size:13px;box-shadow:var(--schaduw)}
.bk b{display:block;font:800 15px/1.3 var(--kop);margin-bottom:4px}
.bk.nee{background:repeating-linear-gradient(45deg,var(--lijn),var(--lijn) 6px,transparent 6px,transparent 12px);color:transparent;border-top-color:var(--lijn);box-shadow:none}
.bk.nee b{color:var(--zacht)}
.welkom-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}

/* ---------- oefenen ---------- */
.vraag{white-space:pre-line;font:700 22px/1.4 var(--kop);margin:6px 0 22px}
.vraag.lang{font:500 17px/1.55 var(--tekst,inherit)}
.opties{display:grid;gap:10px}
.optie{border:2px solid var(--lijn);background:var(--kaart);border-radius:8px;padding:14px 16px;text-align:left;font-size:17px;display:flex;gap:14px;align-items:center;min-height:58px;transition:border-color .1s,background .1s}
.optie:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--lijn))}
.optie .l{font:800 15px/1 var(--kop);color:var(--ink);min-width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:var(--bg);flex:none}
.optie.kies{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--kaart))}
.optie.kies .l{background:var(--knop);color:#fff}
.opties .optie.goed{border-color:var(--goed);background:color-mix(in srgb,var(--goed) 10%,var(--kaart))}
.optie.goed .l{background:var(--goed);color:#fff}
.opties .optie.fout{border-color:var(--fout);background:color-mix(in srgb,var(--fout) 9%,var(--kaart))}
.optie.fout .l{background:var(--fout);color:#fff}
#qz{max-width:820px}
#qz>.kaart{padding:30px;border-top:4px solid var(--k,var(--acc))}
#qz .top{padding-bottom:14px;border-bottom:1px solid var(--lijn)}
#qz .top h1{font-size:20px}
.koppel{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-items:center}
select,input[type=text],input[type=number],input[type=password]{font:inherit;width:100%;padding:13px 14px;border:1px solid color-mix(in srgb,var(--ink) 22%,var(--lijn));border-radius:6px;background:var(--kaart);color:var(--ink);min-height:50px}
select:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select.goed,input.goed{border-color:var(--goed);border-width:2px} select.fout,input.fout{border-color:var(--fout);border-width:2px}
.reken{display:flex;gap:10px;align-items:center;font-size:22px;font-weight:700}
.reken input{font-size:22px;max-width:240px}
.fb{margin-top:18px;padding:14px 18px;border-radius:8px;font-size:16px}

"doel": "Hoe reken je met procenten, promillages, omzet en brutoresultaat?",
"uitleg": [
{
"t": "Procenten en promillages",
"x": "Procent betekent \"per honderd\", promille (‰) betekent \"per duizend\".\nEen percentage van een getal: 15% van € 240 = 0,15 × 240 = € 36.\nEen promillage: deel / geheel × 1.000‰. Voorbeeld: een brandverzekering van € 1,50 per € 1.000 verzekerde waarde is 1,5‰.\nBedragen in euro's rond je af op 2 decimalen (centen). Percentages meestal op 1 of 2 decimalen."
},
{
"t": "Omzet, afzet en brutoresultaat",
"x": "Afzet = het aantal verkochte producten. Omzet = afzet × verkoopprijs (exclusief btw).\nBrutoresultaat = omzet − inkoopwaarde van de omzet (IWvO). De IWvO is de inkoopprijs van de producten die je verkocht hebt.\nVoorbeeld: 1.200 hoodies à € 25, inkoopprijs € 9. Omzet = € 30.000, IWvO = € 10.800, brutoresultaat = € 19.200.\nBtw hoort niet bij de omzet: de ondernemer draagt de btw af aan de Belastingdienst. Prijs inclusief 21% btw = prijs exclusief btw × 1,21."
},
{
"t": "Procentpunt of procent?",
"x": "Procentpunt is het verschil tussen twee percentages. Van 5% naar 8% is een stijging van 3 procentpunt.\nDe procentuele verandering is (nieuw − oud) / oud × 100% = (8 − 5) / 5 × 100% = 60%."
}
]

"q": "In deze opgave blijft de btw buiten beschouwing.\nNoordvaart Kajakverhuur nv start op 1 april 2027. De nv maakt een overzicht van drie posten over het tweede kwartaal (april tot en met juni 2027). De kajaks hebben een levensduur van 5 jaar en geen restwaarde.\nTabel Gegevens Noordvaart Kajakverhuur nv, tweede kwartaal 2027:\nPost | Bedrag (€) | Betaald op\nAanschaf van 30 kajaks | 45.000 | 1 april 2027\nAflossing op een lening | 10.000 | 30 juni 2027\nLoon voor de maand juni | 6.000 | 5 juli 2027\nMaak van onderstaande tekst een economisch juiste tekst over het tweede kwartaal van 2027.\nDe aanschaf van de kajaks is in het tweede kwartaal ...(1)... .\nDe kosten van de kajaks over dit kwartaal bedragen ...(2)... .\nDe aflossing van de lening is in het tweede kwartaal ...(3)... .\nHet loon voor juni is in het tweede kwartaal ...(4)... .\nKies uit: bij (1) alleen kosten / alleen een uitgave / zowel kosten als een uitgave\nKies uit: bij (2) € 2.250 / € 9.000 / € 45.000\nKies uit: bij (3) alleen kosten / alleen een uitgave / zowel kosten als een uitgave\nKies uit: bij (4) alleen kosten / alleen een uitgave / zowel kosten als een uitgave",

"q": "In deze opgave blijft de btw buiten beschouwing.\nSlotvast nv opent op 1 januari 2027 een escaperoom. De nv maakt een overzicht van twee posten voor het eerste kwartaal van 2027 (januari tot en met maart). De lening van € 300.000 loopt tegen 8% interest per jaar en is op 1 januari opgenomen.\nTabel Gegevens Slotvast nv, eerste kwartaal 2027:\nPost | Bedrag (€) | Betaald op\nHuur van het pand voor januari tot en met juni 2027 | 36.000 | 1 januari 2027\nInterest over januari tot en met juni 2027 | 12.000 | 30 juni 2027\nMaak van onderstaande tekst een economisch juiste tekst over het eerste kwartaal van 2027.\nDe huur is in het eerste kwartaal een uitgave van ...(1)... en levert in dat kwartaal ...(2)... aan kosten op.\nDe interest over het eerste kwartaal is ...(3)... .\nHet bedrag daarvan is ...(4)... .\nKies uit: bij (1) € 18.000 / € 36.000 / € 72.000\nKies uit: bij (2) € 6.000 / € 18.000 / € 36.000\nKies uit: bij (3) alleen kosten / alleen een uitgave / geen kosten en geen uitgave\nKies uit: bij (4) € 3.000 / € 6.000 / € 12.000",

{
"t": "open",
"titel": "Pastamachine",
"q": "In deze opgave blijft de btw buiten beschouwing.\nDelta Pasta nv maakt verse pasta voor supermarkten. Op 1 januari 2028 koopt de nv een nieuwe pastamachine voor € 180.000 en betaalt dat bedrag direct. De machine gaat 10 jaar mee en heeft geen restwaarde. De afdeling financiën stelt voor het eerste kwartaal van 2028 een resultatenbegroting (exploitatiebegroting) en een liquiditeitsbegroting op.\nIn het kwartaal levert Delta Pasta nv pasta voor € 400.000 aan supermarkten. De grondstoffen die in het kwartaal zijn gekocht, zijn ook in dat kwartaal verbruikt. De lonen horen volledig bij de productie van dat kwartaal. Met andere posten hoef je geen rekening te houden.\nEen commissaris ziet dat het saldo van de liquiditeitsbegroting negatief is. Hij vreest dat de nv een verlies lijdt.\nTabel Liquiditeitsbegroting Delta Pasta nv, eerste kwartaal 2028 (bedragen in €):\nPost | Bedrag\nOntvangsten van klanten | 340.000\nGrondstoffen | -160.000\nLonen | -120.000\nAanschaf pastamachine | -180.000\nSaldo | -120.000\nToon met een berekening aan dat het resultaat van Delta Pasta nv over het eerste kwartaal van 2028 positief is.",

"doel": "Hoe werkt een schadeverzekering en wat betaal je ervoor?",
"uitleg": [
{
"t": "Wat is een schadeverzekering?",
"x": "Met een verzekering draag je een risico over aan een verzekeraar. Je betaalt premie, de verzekeraar vergoedt de schade als het misgaat. De afspraken staan in de polis.\nEen schadeverzekering vergoedt de werkelijke schade, maar nooit meer dan de verzekerde som. Voorbeelden: brandverzekering, transportverzekering, bedrijfsschadeverzekering (gederfde winst na een ramp), kredietverzekering (als een afnemer niet betaalt, tot een kredietlimiet), exportkredietverzekering, productaansprakelijkheidsverzekering, aansprakelijkheidsverzekering en rechtsbijstandverzekering."
},
{
"t": "Wat betaal je?",
"x": "Te betalen = premie + poliskosten (en eventueel administratiekosten) + 21% assurantiebelasting.\nBij een autoverzekering werkt een bonus-malusladder: schadevrije jaren geven korting op de premie, een schade laat je treden zakken.\nOnderverzekering: de verzekerde som is lager dan de werkelijke waarde. Dan keert de verzekeraar naar verhouding uit: verzekerde som / werkelijke waarde × schade. Oververzekering heeft geen zin: je krijgt nooit meer dan de schade.\nMet een indexclausule (vwo) stijgt de verzekerde som automatisch mee met de prijzen, zodat je niet onderverzekerd raakt."
}
]

"model": "Kostprijs bergtent = 142 + 640.000 : 8.000 = 142 + 80 = € 222. Kostprijs rugzak = 61 + 840.000 : 12.000 = 61 + 70 = € 131. Verkoopresultaat = 8.500 × (260 − 222) + 11.000 × (138 − 131) = 323.000 + 77.000 = € 400.000 voordelig. Bezettingsresultaat = (8.500 − 8.000) × 80 + (11.000 − 12.000) × 70 = 40.000 − 70.000 = € 30.000 nadelig. Bedrijfsresultaat = 400.000 − 30.000 = € 370.000 voordelig.\nPuntenverdeling:\n• kostprijs bergtent = 142 + 640.000 : 8.000 = € 222 (1)\n• kostprijs wandelrugzak = 61 + 840.000 : 12.000 = € 131 (1)\n• verwacht verkoopresultaat = 8.500 × (260 − 222) + 11.000 × (138 − 131) = 323.000 + 77.000 = € 400.000 voordelig (1)\n• verwacht bezettingsresultaat = (8.500 − 8.000) × 80 + (11.000 − 12.000) × 70 = 40.000 − 70.000 = € 30.000 nadelig (1)\n• verwacht bedrijfsresultaat = 400.000 − 30.000 = € 370.000 voordelig (1)",

"titel": "Houtkachels bij Lindebloem Kachels nv",
"q": "Lindebloem Kachels nv maakt gietstalen houtkachels. Voor het tweede halfjaar van 2027 gaat de onderneming uit van een normale productie van 2.400 kachels. Door de komst van een nieuwe afnemer in Scandinavië verwacht zij in dat halfjaar 2.700 kachels te produceren en te verkopen. Om die orders binnen te halen, verlaagt de onderneming de verkoopprijs tot € 540 per kachel.\nPer kachel is 30 kg plaatstaal nodig tegen € 4,20 per kg. De arbeid bedraagt 6 uur per kachel tegen € 32 per uur. De constante kosten bedragen € 576.000 per halfjaar. De kostprijs wordt berekend bij de normale productie.\nBereken het verwachte bedrijfsresultaat van Lindebloem Kachels nv over het tweede halfjaar van 2027 met behulp van het verwachte verkoopresultaat en het verwachte bezettingsresultaat.\nRond af op hele euro's en vermeld of het resultaat voordelig of nadelig is.",
"model": "Kostprijs = V/W + C/N = 30 × 4,20 + 6 × 32 + 576.000 : 2.400 = 126 + 192 + 240 = € 558 per kachel. De verkoopprijs is € 540, dus het verkoopresultaat is 2.700 × (540 − 558) = € 48.600 nadelig. Bezettingsresultaat = (2.700 − 2.400) × (576.000 : 2.400) = 300 × 240 = € 72.000 voordelig. Bedrijfsresultaat = 72.000 − 48.600 = € 23.400 voordelig.\nPuntenverdeling:\n• kostprijs per kachel = 30 × 4,20 + 6 × 32 + 576.000 : 2.400 = 126 + 192 + 240 = € 558 (1)\n• verwacht verkoopresultaat = 2.700 × (540 − 558) = € 48.600 nadelig (1)\n• verwacht bezettingsresultaat = (2.700 − 2.400) × (576.000 : 2.400) = € 72.000 voordelig (1)\n• verwacht bedrijfsresultaat = 72.000 − 48.600 = € 23.400 voordelig (1)",

"q": "In deze opgave blijft de btw buiten beschouwing.\nWaterlelie Kajak nv maakt kunststof kajaks en werkt met standaardkosten. De normale productie is 500 kajaks per halfjaar. De constante kosten worden toegerekend op basis van de normale productie. In de tabel staan de standaardgegevens en de werkelijke gegevens over het afgelopen halfjaar.\nTabel Standaardgegevens en werkelijke gegevens over het halfjaar:\nGegeven | Standaard of begroot | Werkelijk\nProductie (kajaks) | 500 (normaal) | 560\nKunststof | 12 kg per kajak, € 8 per kg | 6.600 kg, € 9 per kg\nArbeid | 10 uur per kajak, € 30 per uur | 5.500 uur, € 31 per uur\nConstante kosten | € 300.000 | € 306.000\nBereken het budgetresultaat van het afgelopen halfjaar en geef aan of dit resultaat voordelig of nadelig is. (zie formuleblad)\nGeef bij elk deelresultaat dat je gebruikt aan of het voordelig of nadelig is.",

"titel": "Loopfietsen van Brinkhoek",
"q": "In deze opgave blijft de btw buiten beschouwing.\nBrinkhoek Houtspeelgoed bv maakt houten loopfietsen. De begroting voor dit jaar gaat uit van een normale productie van 8.000 loopfietsen. De constante kosten (onder meer huur, afschrijving op de machines en vaste salarissen) zijn begroot op € 400.000. Brinkhoek berekent de constante kosten per loopfiets door op basis van deze begrotingsgegevens.\nEen Duitse speelgoedketen plaatste dit jaar een grote extra bestelling. Daardoor zijn er in werkelijkheid 9.200 loopfietsen gemaakt. De werkelijke constante kosten waren gelijk aan de begrote constante kosten. Het hout is dit jaar iets goedkoper ingekocht dan begroot.\nLeg zonder een berekening uit of het gerealiseerde bezettingsresultaat van dit jaar voordelig of nadelig is.",
"model": "Brinkhoek berekent per loopfiets een vast bedrag aan constante kosten door: de begrote constante kosten gedeeld door de normale productie. Er zijn meer loopfietsen gemaakt dan normaal. Daardoor is in totaal meer aan constante kosten doorberekend dan er was begroot. Het bezettingsresultaat is daarom voordelig.\nPuntenverdeling:\n• Een juist antwoord bevat de volgende redenering: Per loopfiets worden de begrote constante kosten gedeeld door de normale productie doorberekend. De werkelijke productie (9.200) is hoger dan de normale productie (8.000), dus in totaal zijn meer constante kosten doorberekend dan begroot. (1)\n• Er is dus meer doorberekend dan de constante kosten die waren begroot: het bezettingsresultaat is voordelig. (1)",

"q": "Raamwerk nv produceert houten tuinbanken van eikenhout. De directie werkt met standaardkosten. De inkoopmanager heeft in het afgelopen kwartaal eikenhout ingekocht bij een nieuwe leverancier voor een lagere prijs per kilo dan de standaardprijs.\nDe productiemanager meldt dat het geleverde hout veel knoesten bevatte. Bij het zagen en schuren is daardoor meer hout verloren gegaan dan normaal. De directie wil weten of de keuze van de inkoopmanager een goede beslissing was. Het gaat alleen om de kosten van eikenhout.\nTabel Gegevens over eikenhout, afgelopen kwartaal:\nGegeven | Waarde\nStandaardhoeveelheid hout per tuinbank | 6 kg\nStandaardprijs per kg | € 8,00\nWerkelijke productie | 5.000 tuinbanken\nWerkelijk verbruik hout | 34.000 kg\nWerkelijke prijs per kg | € 7,50\nBeoordeel met behulp van berekeningen van het prijsresultaat en het efficiencyresultaat of de inkoopmanager met het goedkoper inkopen van eikenhout goed heeft gehandeld. Geef bij elk resultaat aan of het voordelig of nadelig is.",

"titel": "Pastamachine",
"q": "In deze opgave blijft de btw buiten beschouwing.\nDelta Pasta nv maakt verse pasta voor supermarkten. Op 1 januari 2028 koopt de nv een nieuwe pastamachine voor € 180.000 en betaalt dat bedrag direct. De machine gaat 10 jaar mee en heeft geen restwaarde. De afdeling financiën stelt voor het eerste kwartaal van 2028 een resultatenbegroting (exploitatiebegroting) en een liquiditeitsbegroting op.\nIn het kwartaal levert Delta Pasta nv pasta voor € 400.000 aan supermarkten. De grondstoffen die in het kwartaal zijn gekocht, zijn ook in dat kwartaal verbruikt. De lonen horen volledig bij de productie van dat kwartaal. Met andere posten hoef je geen rekening te houden.\nEen commissaris ziet dat het saldo van de liquiditeitsbegroting negatief is. Hij vreest dat de nv een verlies lijdt.\nTabel Liquiditeitsbegroting Delta Pasta nv, eerste kwartaal 2028 (bedragen in €):\nPost | Bedrag\nOntvangsten van klanten | 340.000\nGrondstoffen | -160.000\nLonen | -120.000\nAanschaf pastamachine | -180.000\nSaldo | -120.000\nToon met een berekening aan dat het resultaat van Delta Pasta nv over het eerste kwartaal van 2028 positief is.",

"titel": "Klimhal",
"q": "In deze opgave blijft de btw buiten beschouwing.\nKlimwand Duinrand nv opent op 1 oktober 2027 een klimhal. Op die dag verkoopt de nv 800 jaarabonnementen à € 270. De klanten betalen direct. Een jaarabonnement geldt van 1 oktober 2027 tot en met 30 september 2028. Ook op 1 oktober 2027 betaalt de nv € 240.000 voor de klimwanden. Die gaan 7 jaar mee en hebben een restwaarde van € 16.000.\nDe nv heeft op 1 oktober 2027 een lening van € 300.000 tegen 5% interest per jaar. De interest wordt per kwartaal achteraf betaald, voor het eerst op 31 december 2027. Op 31 december 2027 lost de nv € 30.000 af. De interest over het vierde kwartaal wordt berekend over € 300.000. Met andere posten hoef je geen rekening te houden.\nToon met een berekening aan dat het resultaat over het vierde kwartaal van 2027 € 100.000 hoger is dan het saldo van de ontvangsten en uitgaven over dat kwartaal.\nDoe het als volgt:\n- Bepaal het resultaat uit de opbrengsten en kosten van het vierde kwartaal.\n- Bepaal het saldo uit de ontvangsten en uitgaven in dat kwartaal.",
"model": "Het abonnement geldt een jaar, dus in het vierde kwartaal hoort een kwart bij de opbrengst: 800 × 270 : 4 = € 54.000. De kosten zijn de afschrijving (240.000 - 16.000) : 7 : 4 = € 8.000 en de interest 300.000 × 0,05 : 4 = € 3.750. De aflossing is geen kosten. Het resultaat is 54.000 - 8.000 - 3.750 = € 42.250. De ontvangsten zijn 800 × 270 = € 216.000. De uitgaven zijn 240.000 + 3.750 + 30.000 = € 273.750, want de aanschaf, de interest en de aflossing zijn betalingen. Het saldo is 216.000 - 273.750 = -€ 57.750. Het verschil is 42.250 - (-57.750) = € 100.000, dus het resultaat is € 100.000 hoger dan het saldo.\nPuntenverdeling:\n• Opbrengst vierde kwartaal: 800 × 270 : 4 = € 54.000 (1)\n• Kosten: afschrijving (240.000 - 16.000) : 7 : 4 = € 8.000 en interest 300.000 × 0,05 : 4 = € 3.750 (de aflossing is geen kosten), dus resultaat 54.000 - 8.000 - 3.750 = € 42.250 (1)\n• Ontvangsten 800 × 270 = € 216.000 en uitgaven 240.000 + 3.750 + 30.000 = € 273.750, dus saldo 216.000 - 273.750 = -€ 57.750 (1)\n• Verschil: 42.250 - (-57.750) = € 100.000, dus het resultaat is € 100.000 hoger dan het saldo (1)",

"model": "Bij 12 jaar is de afschrijving (1.920.000 - 120.000) : 12 = € 150.000 per jaar. Bij 8 jaar is dat (1.920.000 - 120.000) : 8 = € 225.000 per jaar. De afschrijvingskosten stijgen met € 75.000, dus het resultaat daalt met € 75.000 (nadelig). Afschrijven is geen uitgave: de bottellijn is al contant betaald. De liquide middelen veranderen daarom niet door de nieuwe schatting. De bewering is dus niet juist, want alleen het resultaat daalt.\nPuntenverdeling:\n• Afschrijving per jaar bij 12 jaar: (1.920.000 - 120.000) : 12 = € 150.000 (1)\n• Afschrijving per jaar bij 8 jaar: (1.920.000 - 120.000) : 8 = € 225.000 (1)\n• De afschrijvingskosten stijgen met € 75.000 (225.000 - 150.000), dus het resultaat daalt met € 75.000 (nadelig) (1)\n• Afschrijven is geen uitgave en de bottellijn is al contant betaald, dus de liquide middelen veranderen niet door de nieuwe schatting; de bewering is dus niet juist (alleen het resultaat daalt) (1)",
"pnt": 4
},

"titel": "Een rijpingsinstallatie bij Kaasfabriek Hoogland",
"q": "In deze opgave blijft de belasting buiten beschouwing.\nKaasfabriek Hoogland nv koopt aan het begin van het boekjaar een rijpingsinstallatie voor € 2.100.000 en betaalt die direct contant. De restwaarde is geschat op € 300.000. De begroting voor dit boekjaar ging uit van een levensduur van 12 jaar en dus van een afschrijving van € 150.000 per jaar. Het resultaat vóór afschrijving van de installatie is € 900.000 en verandert niet.\nVoordat de eerste afschrijving wordt geboekt, verlengt de directie de geschatte levensduur naar 15 jaar. De restwaarde blijft gelijk.\nAan het einde van het boekjaar keert Kaasfabriek Hoogland een tussentijds dividend* uit van 40% van het resultaat na afschrijvingen van dat boekjaar. Dit dividend wordt contant betaald. Er zijn verder geen uitgaven of ontvangsten die door de nieuwe schatting veranderen.\n* Tussentijds dividend: een uitkering aan aandeelhouders vóór de vaststelling van de jaarrekening.\nBeredeneer met hoeveel euro de liquide middelen aan het einde van het eerste boekjaar door de verlengde levensduurschatting veranderen.",
"model": "De nieuwe afschrijving is (2.100.000 - 300.000) : 15 = € 120.000 per jaar. In de begroting stond € 150.000, dus de afschrijvingskosten zijn € 30.000 lager (150.000 - 120.000) en het resultaat is € 30.000 hoger (voordelig). Daardoor keert Kaasfabriek Hoogland 40% × € 30.000 = € 12.000 meer dividend uit en dat is een uitgave. Afschrijven is zelf geen uitgave, want de installatie is al betaald. De liquide middelen dalen daarom door de nieuwe schatting met € 12.000.\nPuntenverdeling:\n• Nieuwe afschrijving per jaar: (2.100.000 - 300.000) : 15 = € 120.000 (1)\n• De afschrijvingskosten zijn € 30.000 lager (150.000 - 120.000), dus het resultaat is € 30.000 hoger (voordelig) (1)\n• Het extra dividend is 40% × € 30.000 = € 12.000 en dat is een uitgave (1)\n• Afschrijven is zelf geen uitgave (de installatie is al betaald), dus de liquide middelen dalen door de nieuwe schatting met € 12.000, alleen via het extra dividend (1)",

"model": "De kostenlijn begint nu hoger, op € 60.000 in plaats van € 40.000, maar hij loopt minder steil omdat de variabele kosten dalen van € 3 naar € 2 per pak. De opbrengstlijn begint in de oorsprong en verandert niet. De hogere constante kosten schuiven het snijpunt naar rechts, de lagere variabele kosten schuiven het naar links. Daarom reken ik de nieuwe break-evenafzet uit: de dekkingsbijdrage is 8 - 2 = € 6 per pak, dus 60.000 : 6 = 10.000 pakken. Dat is meer dan de oude break-evenafzet van 8.000 pakken. Bij 9.000 pakken zitten we links van het snijpunt. Daar ligt de opbrengstlijn onder de kostenlijn. Dus Meerwind maakt verlies.\nPuntenverdeling:\n• Een juiste redenering bevat: De lijn van de totale kosten begint hoger (€ 60.000 in plaats van € 40.000) en loopt minder steil (€ 2 in plaats van € 3 per pak). De lijn van de totale opbrengst verandert niet. (1)\n• De hogere constante kosten schuiven het snijpunt naar rechts. De lagere variabele kosten per pak (hogere dekkingsbijdrage) schuiven het snijpunt naar links. Het nettoeffect moet dus worden bepaald. (1)\n• Break-evenafzet = 60.000 : (8 - 2) = 10.000 pakken. Het snijpunt ligt nu rechts van het oude snijpunt bij 8.000 pakken. (1)\n• 9.000 pakken ligt links van het nieuwe snijpunt. Daar ligt de opbrengstlijn onder de kostenlijn, dus Meerwind maakt verlies. (1)",

"q": "Dijkman Fietstassen bv maakt waterdichte fietstassen en verkoopt ze aan fietswinkels. De verkoopprijs per tas is hoger dan de variabele kosten per tas. Daarnaast heeft de onderneming constante kosten per jaar, onder andere voor de huur van de werkplaats en de afschrijving op de naaimachines. In deze opgave blijft de btw buiten beschouwing.\nDe afdeling Financiën heeft een break-evengrafiek gemaakt. De grafiek is hier beschreven als schets, zonder getallen op de assen. De afzet in aantallen tassen staat op de horizontale as en de bedragen in euro's staan op de verticale as.\nIn de grafiek staan twee rechte lijnen. De lijn TO is de totale opbrengst. Deze lijn begint in de oorsprong. De lijn TK is de totale kosten. Deze lijn begint op de verticale as boven de oorsprong en loopt minder steil dan TO. De lijnen snijden elkaar in punt S, bij een afzet van Q op de horizontale as.\nDe verwachte afzet van dit jaar ligt op de horizontale as links van Q.\nLeg met behulp van de grafiek uit hoe het resultaat van Dijkman Fietstassen verandert als de afzet stijgt van de verwachte afzet tot een afzet boven Q.",
"model": "Bij de verwachte afzet, links van Q, ligt de lijn van de totale kosten boven de lijn van de totale opbrengst. Het resultaat is het verticale verschil tussen die twee lijnen. De kosten zijn hoger dan de opbrengst, dus er is verlies. Als de afzet stijgt, wordt dat verschil kleiner. De opbrengstlijn loopt steiler dan de kostenlijn, want elke extra tas brengt meer op dan de extra variabele kosten. Het verlies wordt dus steeds kleiner. In punt S, bij afzet Q, zijn opbrengst en kosten gelijk en is het resultaat nul. Bij een afzet boven Q ligt de opbrengstlijn boven de kostenlijn. Dan is er winst, en die winst wordt groter als de afzet verder stijgt.\nPuntenverdeling:\n• Een juiste uitleg bevat de volgende elementen: Bij de verwachte afzet (links van Q) ligt lijn TK boven lijn TO: de totale kosten zijn hoger dan de totale opbrengst. Het resultaat is het verticale verschil tussen beide lijnen, dus het resultaat is negatief (verlies). (1)\n• Als de afzet stijgt, wordt het verticale verschil kleiner, omdat TO steiler loopt dan TK: elke extra tas levert meer opbrengst op dan extra variabele kosten (positieve dekkingsbijdrage), dus het verlies neemt af. (1)\n• Bij afzet Q (punt S) zijn de totale opbrengst en de totale kosten gelijk, dus het resultaat is nul. Bij een afzet boven Q ligt TO boven TK, dus is het resultaat positief (winst) en deze winst neemt verder toe als de afzet stijgt. (1)",

"q": "In deze opgave blijft de btw buiten beschouwing.\nNoordkade Fietstassen nv maakt waterdichte fietstassen voor webwinkels. De jaarbegroting is gebaseerd op een normale productie van 60.000 fietstassen. De constante kosten zijn begroot op € 900.000. Daarin zitten onder meer de huur van de werkplaats, de afschrijving op de naaimachines en de salarissen van het vaste personeel.\nDit jaar zijn er 52.000 fietstassen gemaakt, omdat een grote afnemer minder bestelde dan verwacht. In het tweede halfjaar is de huur van de werkplaats verhoogd. Ook is het zeildoek duurder ingekocht dan begroot.\nLeg zonder een berekening uit of het gerealiseerde bezettingsresultaat van dit jaar voordelig of nadelig is.",
"model": "Noordkade berekent per fietstas een vast bedrag aan constante kosten door: de begrote constante kosten gedeeld door de normale productie. Er zijn minder fietstassen gemaakt dan normaal. Daardoor is in totaal minder aan constante kosten doorberekend dan begroot en is een deel van de constante kosten niet gedekt. Het bezettingsresultaat is daarom nadelig. De hogere huur en het duurdere zeildoek hebben hier geen invloed op.\nPuntenverdeling:\n• Een juist antwoord bevat de volgende redenering: Per fietstas worden de begrote constante kosten gedeeld door de normale productie doorberekend. Omdat de werkelijke productie lager is dan de normale productie, zijn in totaal minder constante kosten doorberekend dan begroot. (1)\n• Een deel van de begrote constante kosten is dus niet gedekt: het bezettingsresultaat is nadelig. (1)",

"q": "Raamwerk nv produceert houten tuinbanken van eikenhout. De directie werkt met standaardkosten. De inkoopmanager heeft in het afgelopen kwartaal eikenhout ingekocht bij een nieuwe leverancier voor een lagere prijs per kilo dan de standaardprijs.\nDe productiemanager meldt dat het geleverde hout veel knoesten bevatte. Bij het zagen en schuren is daardoor meer hout verloren gegaan dan normaal. De directie wil weten of de keuze van de inkoopmanager een goede beslissing was. Het gaat alleen om de kosten van eikenhout.\nTabel Gegevens over eikenhout, afgelopen kwartaal:\nGegeven | Waarde\nStandaardhoeveelheid hout per tuinbank | 6 kg\nStandaardprijs per kg | € 8,00\nWerkelijke productie | 5.000 tuinbanken\nWerkelijk verbruik hout | 34.000 kg\nWerkelijke prijs per kg | € 7,50\nBeoordeel met behulp van berekeningen van het prijsresultaat en het efficiencyresultaat of de inkoopmanager met het goedkoper inkopen van eikenhout goed heeft gehandeld. Geef bij elk resultaat aan of het voordelig of nadelig is.",

"q": "In deze opgave blijft de btw buiten beschouwing.\nKlimwand Duinrand nv opent op 1 oktober 2027 een klimhal. Op die dag verkoopt de nv 800 jaarabonnementen à € 270. De klanten betalen direct. Een jaarabonnement geldt van 1 oktober 2027 tot en met 30 september 2028. Ook op 1 oktober 2027 betaalt de nv € 240.000 voor de klimwanden. Die gaan 7 jaar mee en hebben een restwaarde van € 16.000.\nDe nv heeft op 1 oktober 2027 een lening van € 300.000 tegen 5% interest per jaar. De interest wordt per kwartaal achteraf betaald, voor het eerst op 31 december 2027. Op 31 december 2027 lost de nv € 30.000 af. De interest over het vierde kwartaal wordt berekend over € 300.000. Met andere posten hoef je geen rekening te houden.\nToon met een berekening aan dat het resultaat over het vierde kwartaal van 2027 € 100.000 hoger is dan het saldo van de ontvangsten en uitgaven over dat kwartaal.\nDoe het als volgt:\n- Bepaal het resultaat uit de opbrengsten en kosten van het vierde kwartaal.\n- Bepaal het saldo uit de ontvangsten en uitgaven in dat kwartaal.",

const OPDRACHT=/^(Bereken|Leg|Verklaar|Toon|Geef|Noem|Beargumenteer|Laat|Bepaal|Licht|Onderbouw|Schrijf|Beschrijf|Welke|Wat|Waarom|Hoe|Is |Zal |Zijn |Heeft |Kies|Vul|Teken|Ga |Maak|Vergelijk)/;

function fmt(t, opdracht){
  if(t==null||t==='') return ''; const L=String(t).split('\n'); let out='', i=0;
  const rij=l=>/\S \| \S/.test(l), item=l=>/^\s*[-•−–]\s+/.test(l);
  while(i<L.length){ const l=L[i];
    if(rij(l)&&i+1<L.length&&rij(L[i+1])){ const rows=[]; while(i<L.length&&rij(L[i])) rows.push(L[i++].split('|').map(c=>c.trim()));
      out+=`<div class="vtabel"><table>${rows.map((r,k)=>`<tr>${r.map(c=>k===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`; continue }
    if(item(l)){ const it=[]; while(i<L.length&&item(L[i])){ const bol=/^\s*•/.test(L[i]); let x=L[i++].replace(/^\s*[-•−–]\s+/,'');
        // bij '•'-deelscores horen de regels eronder (berekeningen) nog bij hetzelfde punt
        while(bol&&i<L.length&&L[i].trim()&&!item(L[i])&&!NOOT.test(L[i].trim())&&!/\(\dp?\)\s*$/.test(x)) x+=' '+L[i++].trim();
        it.push(x) }
      out+=`<ul class="vlijst">${it.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`; continue }
    const x=l.trim(); i++; if(!x) continue;
    if(/^Tabel\b|^(Doe het als volgt|Puntenverdeling)/.test(x)) out+=`<p class="vkop">${esc(x)}</p>`;
    else if(NOOT.test(x)) out+=`<p class="vnoot">${esc(x)}</p>`;
    else out+=`<p${opdracht&&OPDRACHT.test(x)?' class="vopdracht"':''}>${esc(x)}</p>`;
  }
  return `<div class="vtekst">${out}</div>`;
}

    const m=x.match(/^\s*•\s*(.+?)\s*\((\d)p?\)\s*$/); if(m) ds.push({t:m[1],p:+m[2]}) }
  return ds.length>1&&ds.reduce((a,b)=>a+b.p,0)===v.pnt?ds:null }

function nieuweStaat(){
  return {v:1, id:'', code:'', naam:'', klas:'', upd:0, aangemaakt:Date.now(),

let S = null;

const UNION = new Set(['kaarten','badges','gekocht']);
function merge(a,b){
  // b is de nieuwste (hoogste upd) bij gelijke velden die niet kunnen groeien
  if(a===undefined||a===null) return b; if(b===undefined||b===null) return a;
  if(typeof a==='number'&&typeof b==='number') return Math.max(a,b);
  if(Array.isArray(a)&&Array.isArray(b)) return b;
  if(typeof a==='object'&&typeof b==='object'){
    const o={}; for(const k of new Set([...Object.keys(a),...Object.keys(b)])){
      if(UNION.has(k)&&Array.isArray(a[k])&&Array.isArray(b[k])) o[k]=[...new Set([...a[k],...b[k]])];
      else if(k==='et') o[k]=mergeEt(a[k],b[k]);
      else o[k]=merge(a[k],b[k]);
    } return o;
  }
  return b;
}
function mergeEt(a,b){ // per eindterm een lijstje recente resultaten; neem de langste/nieuwste
  a=a||{}; b=b||{}; const o={};
  for(const k of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[k]||{n:0,r:[]},y=b[k]||{n:0,r:[]};o[k]=(y.n>=x.n)?y:x}
  return o;
}
function mergeStaat(oud,nieuw){ // oud en nieuw in willekeurige volgorde
  const [x,y] = (oud.upd||0)<=(nieuw.upd||0)?[oud,nieuw]:[nieuw,oud];
  const m = merge(x,y); m.upd=Math.max(x.upd||0,y.upd||0); return m;
}

function alleVragen(){ const out=[]; for(const w in LEVELS){ for(const l of LEVELS[w]) for(const v of l.vragen) out.push(Object.assign({w,l:l.id,lniv:l.niv},v)); } if(typeof EXAMEN!=='undefined') for(const v of EXAMEN.vragen) out.push(Object.assign({w:'ex'},v)); return out }
const vrNiv = v => (!v.niv||v.niv===niv()) && (!v.lniv||v.lniv===niv());
let _vmap=null; function vraagById(id){ if(!_vmap){_vmap={}; for(const v of alleVragen()) _vmap[v.id]=v} return _vmap[id] }

function nakijken(v, antw){
  if(v.t==='mc'||v.t==='ex') return antw===v.a;
  if(v.t==='wo') return antw===v.a;
  if(v.t==='open') return antw===true||(!!antw&&antw.max>0&&antw.p>=antw.max);
  if(v.t==='koppel') return v.p.every((p,i)=>antw[i]===p[1]);
  if(v.t==='reken'){ const x=parseGetal(antw); if(isNaN(x)) return false; const tol = v.eh==='€'?0.011:0.051; return Math.abs(x-v.a)<=tol }
  return false;
}
// kaarten die een vraag oplevert: het begrip b, en bij koppelvragen elk begrip uit de paren dat een kaart is
let _alleKaarten=null;
function kaartenVan(v){ if(!_alleKaarten){ _alleKaarten=new Set(); for(const w in LEVELS) Object.keys(LEVELS[w].begrippen||{}).forEach(k=>_alleKaarten.add(k)) }
  const c=[v.b].concat(v.t==='koppel'?v.p.flat():[]); return [...new Set(c.filter(k=>k&&_alleKaarten.has(k)))] }
function registreer(v, goed){
  if(!v.gen){ const r=S.vr[v.id]||{g:0,f:0}; goed?r.g++:r.f++; r.t=Date.now(); S.vr[v.id]=r; }
  else { const k=v.id; const r=S.vr[k]||{g:0,f:0}; goed?r.g++:r.f++; S.vr[k]=r; }
  if(v._pt&&!v.gen){ S.vr[v.id].pt=v._pt.p; S.vr[v.id].max=v._pt.max }
  if(v.e){ const et=S.et[v.e]||{n:0,r:[]}; et.r=et.r.concat(v._pt?Math.round(v._pt.p/v._pt.max*100)/100:(goed?1:0)).slice(-20); et.n++; S.et[v.e]=et; }
  let nieuweKaart=false;
  if(goed){ S.xp+=10; S.mVerd+=1; const nw=kaartenVan(v).filter(k=>!S.kaarten.includes(k)); if(nw.length){ S.kaarten.push(...nw); nieuweKaart=nw } }
  // herhaalronde: foute vragen komen terug, na 2× goed verdwijnen ze
  if(!v.gen){
    if(!goed){ if(!S.herhaal.includes(v.id)) S.herhaal.push(v.id); S.hgoed[v.id]=0; }
    else if(S.herhaal.includes(v.id)){ S.hgoed[v.id]=(S.hgoed[v.id]||0)+1; if(S.hgoed[v.id]>=2){ S.herhaal=S.herhaal.filter(x=>x!==v.id); delete S.hgoed[v.id]; } }
  }
  return nieuweKaart;
}
function etScore(code){ const et=S.et[code]; if(!et||et.r.length<3) return null; let s=0,w=0; et.r.forEach((x,i)=>{const g=i+1; s+=x*g; w+=g}); return Math.round(s/w*100) }
function domeinScore(d){ const sc=Object.keys(EINDTERMEN).filter(k=>EINDTERMEN[k].d===d).map(etScore).filter(x=>x!==null); return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null }
function medaille(score){ let m=null; for(const x of MEDAIL) if(score>=x.min) m=x; return m }

function wereldStand(w){
  const lvs=lvsVoor(w).filter(speelbaar); if(!lvs.length) return null;
  const echte=lvs.filter(l=>l.vragen.length);
  return {klaar:echte.filter(l=>(S.lv[l.id]||{}).best>=MEDAIL[0].min).length, totaal:echte.length, pct:Math.round(lvs.reduce((s,l)=>s+Math.min((S.lv[l.id]||{}).best||0,VRAGEN_PER_LEVEL),0)/(lvs.length*VRAGEN_PER_LEVEL)*100), diploma:!!(S.toets[w]&&S.toets[w].klaar)};
}
// Een level gaat open als het vorige level met vragen in hetzelfde hoofdstuk (hfd) brons heeft. Rekenlabs zijn altijd open.
function levelOpen(w,i){ const lvs=lvsVoor(w).filter(speelbaar); const l=lvs[i]; if(!l||l.id.endsWith('.r')) return true;
  const vorige=lvs.slice(0,i).filter(x=>!x.id.endsWith('.r')&&x.vragen.length&&(x.hfd||'')===(l.hfd||'')).pop();
  return !vorige||((S.lv[vorige.id]||{}).best||0)>=MEDAIL[0].min }
function toetsOpen(w){ const alle=lvsVoor(w).filter(l=>l.vragen.length); const kern=alle.filter(l=>!l.extra); const lvs=kern.length?kern:alle; return lvs.length>0&&lvs.every(l=>((S.lv[l.id]||{}).best||0)>=MEDAIL[0].min) }

wereld(w){
  const W=WERELDEN.find(x=>x.id===w), lvs=lvsVoor(w).filter(speelbaar), st=wereldStand(w);
  const t=S.toets[w]||{}; const tOpen=toetsOpen(w);
  const kaarten=Object.keys((LEVELS[w]||{}).begrippen||{}); const heb=kaarten.filter(k=>S.kaarten.includes(k)).length;
  const vi=lvs.findIndex((l,i)=>levelOpen(w,i)&&!(((S.lv[l.id]||{}).best||0)>=MEDAIL[0].min)&&!l.id.endsWith('.r')); const vl=vi>=0?lvs[vi]:null;
  const actie=(l,i)=>levelOpen(w,i)?`startLevel('${w}','${l.id}')`:`melding('Haal eerst brons in het vorige level')`;
  const paneel=lvs.map((l,i)=>{const r=S.lv[l.id]||{}; const m=r.best!=null?medaille(r.best):null; return `<button onclick="${actie(l,i)}"><span>${levelOpen(w,i)?(m?m.e:'○'):'🔒'}</span><span>${esc(l.naam)}</span></button>`}).join('');
  const kaart=(l,i)=>{const r=S.lv[l.id]||{}; const open=levelOpen(w,i); const m=r.best!=null?medaille(r.best):null;
    return `<button class="levelkaart ${open?'':'dicht'}" onclick="${actie(l,i)}"><span class="boven"><span>${l.id.endsWith('.r')?'Rekenlab':l.hfd?'Level':'Start'}${l.niv?' · '+NIVEAUS[l.niv]:''}</span><span>${open?(m?m.e:'⚪'):'🔒'}</span></span>
      <h3>${esc(l.naam)}</h3><p>${esc(l.kort)}</p>
      <span class="onder"><span>${r.best!=null?`Beste score ${r.best}/${VRAGEN_PER_LEVEL}`:open?'Nog niet gespeeld':'Op slot'}</span><span>${open?(r.best!=null?'Opnieuw ›':'Start ›'):''}</span></span></button>`};
  // levels gegroepeerd: eerst het rekenlab, dan de paragrafen en daarna de examentraining
  const groepen=[]; lvs.forEach((l,i)=>{ const g=l.hfd||''; let x=groepen.find(y=>y.g===g); if(!x){ x={g,h:[]}; groepen.push(x) } x.h.push(kaart(l,i)) });
  groepen.sort((a,b)=>(a.g?1:0)-(b.g?1:0));
  const heeftHfd=groepen.some(x=>x.g);
  const blokken=groepen.map(x=>`<div class="sectie">${x.g?esc(x.g):'Rekenlab: oefenen met steeds nieuwe getallen'}</div><div class="levels">${x.h.join('')}</div>`).join('')+

  return `<section class="foto held" style="--k:${W.kleur};${foto(w,1800)}"><div class="in">
    <div class="paneel"><h4>In deze wereld</h4>${paneel}</div>

     <span class="eyebrow">${W.lab}</span><h1>${esc(W.naam)}</h1>

    ${blokken}
    <div class="toetsblok"><span class="ic">${t.klaar?'🎓':(tOpen?'📝':'🔒')}</span><div style="flex:1"><h3>Eindtoets: ${esc(W.naam)}</h3><p>${t.klaar?`Diploma behaald. De eerste keer had je ${t.eerste} van ${t.tot||TOETS_VRAGEN} goed.`:tOpen?`Vragen uit deze hele wereld. Je oefent door tot alles goed is.`:'Gaat open als je bij alle levels minstens brons hebt.'}</p></div>
     ${tOpen?`<button class="knop" onclick="startToets('${w}')">${t.klaar?'Opnieuw':'Start'}</button>`:''}</div>
   </div>${VOET()}`;

  const lv=Object.entries(S.lv);

// ===== Oefenen: rondes starten =====
function vragenVoorLevel(l){
  const vaste=shuffle(l.vragen); const gens=(l.gens||[]);
  let set;
  if(!vaste.length&&!gens.length) return [];
  if(!vaste.length) set=Array.from({length:VRAGEN_PER_LEVEL},()=>maakGen(pick(gens)));
  else { const nGen=Math.min(gens.length?2:0,VRAGEN_PER_LEVEL); set=vaste.slice(0,VRAGEN_PER_LEVEL-nGen).concat(Array.from({length:nGen},()=>maakGen(pick(gens)))); }
  return shuffle(set);
}
function startLevel(w,lid,direct){ const l=lvsVoor(w).find(x=>x.id===lid); if(!l||!speelbaar(l)){ melding('Dit level heeft nog geen vragen'); return }
  if(l.uitleg&&l.uitleg.length&&!direct){ go('uitleg',{w,lid}); return } const W=WERELDEN.find(x=>x.id===w);
  Q={modus:'level',titel:l.naam,w,lid,kleur:W.kleur,vragen:vragenVoorLevel(l),i:0,res:[],terug:`go('wereld','${w}')`}; go('quiz') }
function startToets(w){ const W=WERELDEN.find(x=>x.id===w); const lvs=lvsVoor(w).filter(l=>l.vragen.length);
  const per=Math.max(3,Math.ceil((TOETS_VRAGEN-2)/Math.max(1,lvs.length))); let pool=[]; lvs.forEach(l=>pool.push(...shuffle(l.vragen.filter(v=>v.t!=='open')).slice(0,per).map(v=>Object.assign({l:l.id},v)))); pool=shuffle(pool).slice(0,TOETS_VRAGEN-2);
  const gens=[...new Set(lvsVoor(w).flatMap(l=>l.gens||[]))]; if(gens.length) pool.push(maakGen(pick(gens)),maakGen(pick(gens)));
  Q={modus:'toets',titel:`Eindtoets ${W.naam}`,w,kleur:W.kleur,vragen:shuffle(pool),i:0,res:[],ronde:1,terug:`go('wereld','${w}')`}; go('quiz') }
function startHerhaal(){ const v=shuffle(S.herhaal).slice(0,10).map(vraagById).filter(Boolean); if(!v.length){go('herhaal');return}
  Q={modus:'herhaal',titel:'Herhaalronde',vragen:v,i:0,res:[],terug:"go('herhaal')"}; go('quiz') }
function startEindterm(k){ let v=shuffle(alleVragen().filter(x=>x.e===k&&vrNiv(x))).slice(0,8); const g=Object.keys(GENS).filter(n=>maakGen(n).e===k);
  while(v.length<6&&g.length) v.push(maakGen(pick(g))); if(!v.length){melding('Hier zijn nog geen vragen voor');return}
  Q={modus:'et',titel:EINDTERMEN[k].t,vragen:shuffle(v),i:0,res:[],terug:"go('vaardig')"}; go('quiz') }
function startDomein(d){ const ets=Object.keys(EINDTERMEN).filter(k=>EINDTERMEN[k].d===d);
  // zwakste eindtermen vaker: sorteer op score
  let v=alleVragen().filter(x=>ets.includes(x.e)&&vrNiv(x)); v=shuffle(v).sort((a,b)=>(etScore(a.e)??50)-(etScore(b.e)??50)).slice(0,10);
  if(d==='A'||v.length<6){ const g=Object.keys(GENS).filter(n=>ets.includes(maakGen(n).e)); while(v.length<10&&g.length) v.push(maakGen(pick(g))) }
  if(!v.length){melding('Hier zijn nog geen vragen voor');return}
  const D=DOMEINEN.find(x=>x.id===d); Q={modus:'domein',titel:D.naam,kleur:D.kleur,vragen:shuffle(v),i:0,res:[],terug:"go('vaardig')"}; go('quiz') }

// ===== Adaptief oefenen =====
// Na een fout antwoord krijgt de leerling een extra vraag over hetzelfde onderwerp (steunvraag), maximaal 3 per ronde.
// Steunvragen tellen niet mee voor de medaille van een level, wel voor de vaardigheidsscore.
const STEUN_MAX=3, STEUN_MODI=['level','et','domein','herhaal','slim'];
const autoNakijk = v => ['mc','wo','ex','reken','koppel'].includes(v.t);
function steunvraag(v){
  if(!Q||!STEUN_MODI.includes(Q.modus)||!v.e||(Q.nSteun||0)>=STEUN_MAX) return;
  const al=new Set(Q.vragen.map(x=>x.id));
  const recentGoed=x=>{const r=S.vr[x.id]; return r&&r.g>0&&r.t&&Date.now()-r.t<3*864e5};
  let kand=alleVragen().filter(x=>x.e===v.e&&vrNiv(x)&&autoNakijk(x)&&!al.has(x.id));
  kand=shuffle(kand).sort((a,b)=>(recentGoed(a)?1:0)-(recentGoed(b)?1:0));
  let nw=kand[0];
  if(!nw){ const g=Object.keys(GENS).filter(n=>{try{return maakGen(n).e===v.e}catch(e){return false}}); if(g.length) nw=maakGen(pick(g)) }
  if(!nw) return;
  nw=Object.assign({},nw,{_steun:true}); delete nw._mix;
  Q.vragen.splice(Math.min(Q.i+2,Q.vragen.length),0,nw); Q.nSteun=(Q.nSteun||0)+1;
  const fb=$('#fb'); if(fb) fb.insertAdjacentHTML('beforeend',`<p class="zacht" style="font-size:14px;margin:6px 0 0">➕ Je krijgt zo een extra vraag over ${esc((EINDTERMEN[v.e]||{}).t||'dit onderwerp')}.</p>`);
}
// Slim oefenen: 10 vragen uit de onderwerpen waar de leerling het zwakst op scoort (plus foute vragen uit de herhaalronde)
function zwaksteOnderwerpen(n){
  const metVragen=new Set(alleVragen().filter(x=>vrNiv(x)&&autoNakijk(x)&&x.e).map(x=>x.e));
  const gespeeld=Object.keys(S.et).filter(k=>metVragen.has(k)&&EINDTERMEN[k]);
  return gespeeld.map(k=>[k,etScore(k)??60]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]);
}
function startSlim(){
  const ets=zwaksteOnderwerpen(4);
  let v=S.herhaal.map(vraagById).filter(x=>x&&autoNakijk(x)&&vrNiv(x)); v=shuffle(v).slice(0,3);
  const al=new Set(v.map(x=>x.id));
  ets.forEach((k,i)=>{ const per=i===0?3:2; shuffle(alleVragen().filter(x=>x.e===k&&vrNiv(x)&&autoNakijk(x)&&!al.has(x.id))).slice(0,per).forEach(x=>{v.push(x);al.add(x.id)}) });
  if(v.length<5){ melding('Oefen eerst een paar levels. Daarna weet de app waar je extra oefening nodig hebt.',4000); return }
  Q={modus:'slim',titel:'Slim oefenen',vragen:shuffle(v).slice(0,10),i:0,res:[],terug:"go('vaardig')"}; go('quiz') }

// ===== Quiz-engine =====
let antw=null;
function tekenVraag(){

  if(v.t==='mc') body=`<div class="opties">${v._mix.map((oi,k)=>`<button class="optie" data-k="${oi}" onclick="kies(this,${oi})"><span class="l">${'ABCD'[k]}</span><span>${esc(v.o[oi])}</span></button>`).join('')}</div>`;
  else if(v.t==='ex') body=`${v.bron?`<div class="kaart" style="margin-bottom:12px;font-size:15px;white-space:pre-wrap">${esc(v.bron)}</div>`:''}<div class="opties">${v.o.map((o,k)=>`<button class="optie" data-k="${k}" onclick="kies(this,${k})"><span class="l">${'ABCDE'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  else if(v.t==='wo') body=`<div class="opties" style="grid-template-columns:1fr 1fr"><button class="optie" data-k="true" onclick="kies(this,true)"><span class="l">✔</span><span>Waar</span></button><button class="optie" data-k="false" onclick="kies(this,false)"><span class="l">✘</span><span>Niet waar</span></button></div>`;
  else if(v.t==='koppel'){ if(!v._r) v._r=shuffle([...new Set(v.p.map(p=>p[1]))]); antw=v.p.map(()=>'');
    body=`<div class="koppel">${v.p.map((p,i)=>`<b>${esc(p[0])}</b><select data-i="${i}" onchange="antw[${i}]=this.value;$('#ok').disabled=antw.some(x=>!x)"><option value="">Kies…</option>${v._r.map(r=>`<option>${esc(r)}</option>`).join('')}</select>`).join('')}</div>`; }
  else if(v.t==='open') body=`<textarea id="oIn" rows="5" style="width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--lijn)" placeholder="Schrijf je antwoord op, zoals op het examen." oninput="antw=this.value"></textarea><p class="zacht" style="font-size:14px">Daarna zie je het antwoordmodel en geef je jezelf punten.${v.pnt?` Maximaal ${v.pnt} punt${v.pnt>1?'en':''}.`:''}</p>`;
  else if(v.t==='reken') body=`<div class="reken">${v.eh==='€'?'€':''}<input type="text" id="rIn" inputmode="decimal" autocomplete="off" oninput="antw=this.value;$('#ok').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter'&&!$('#ok').disabled)controleer()">${v.eh==='%'?'%':''}</div><p class="zacht" style="font-size:14px">Gebruik een komma voor decimalen. ${v.eh==='€'?'Rond af op 2 decimalen.':'Rond af op 1 decimaal.'}</p>`;
  $('#qz').innerHTML=`<div class="top"><button class="terug" onclick="if(confirm('Stoppen? Deze ronde telt dan niet mee.'))${Q.terug.replace(/"/g,'&quot;')}">‹ Stop</button><h1 style="font-size:18px">${esc(Q.titel)}</h1><span class="chip">${Q.i+1} / ${Q.vragen.length}</span></div>
   <div class="voortgang">${bol}</div><div class="kaart">${v._steun?`<p class="chip" style="display:inline-block;margin:0 0 8px">➕ Extra oefenvraag</p>`:''}${v.ctx?`<div class="zacht vctx" style="margin-top:0;font-size:14px">${fmt(v.ctx)}</div>`:''}<div class="vraag${v.q.length>180||v.q.includes('\n')?' lang':''}">${v.q.includes('\n')||v.q.length>180?fmt(v.q,true):esc(v.q)}</div>${body}<div id="fb"></div>
   <div class="voet"><button class="knop" id="ok" disabled onclick="controleer()">Controleer</button></div></div>`;
  if(v.t==='reken') setTimeout(()=>$('#rIn')&&$('#rIn').focus(),50);

}
function kies(el,k){ if(Q.fase!=='vraag') return; document.querySelectorAll('.optie').forEach(x=>x.classList.remove('kies')); el.classList.add('kies'); antw=k; $('#ok').disabled=false }
function juistTekst(v){
  if(v.t==='mc'||v.t==='ex') return v.o[v.a]; if(v.t==='wo') return v.a?'Waar':'Niet waar';
  if(v.t==='open') return v.model||'';
  if(v.t==='reken') return v.eh==='€'?eur(v.a):(nl1(v.a)+(v.eh==='%'?'%':'')); if(v.t==='koppel') return v.p.map(p=>p[0]+' → '+p[1]).join(' · ');
}
// open vraag: eerst het antwoordmodel tonen, dan punten toekennen.
// Met deelscores vinkt de leerling per deelscore aan wat goed is; een rekenuitkomst die in het antwoord staat, vinkt de computer alvast aan.
// Zonder deelscores kiest de leerling 0 t/m het maximum aantal punten.
function controleer(){
  if(Q.fase!=='vraag') return; const v=Q.vragen[Q.i];
  if(v.t==='open'&&antw!==true&&antw!==false&&!(antw&&antw.max)){ Q.fase='zelf'; const tekst=String(antw||''); const i=$('#oIn'); if(i) i.readOnly=true;
    const ds=v.pnt?deelscoresVan(v):null; let nakijk='';
    if(ds){ nakijk=`<p style="margin:14px 0 6px"><b>Vink aan wat er in jouw antwoord goed is:</b></p><div class="deelscores">${ds.map((d,k)=>{ const g=uitkomstVan(d.t); const auto=bevatGetal(tekst,g);

}

function printExamen(){
