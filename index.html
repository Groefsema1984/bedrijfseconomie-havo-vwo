  let v = c ? exVragen().filter(x=>x.ex===c).sort((a,b)=>a.nr-b.nr) : d ? exVragen().filter(x=>x.d===d).sort((a,b)=>a.ex<b.ex?-1:a.ex>b.ex?1:a.nr-b.nr) : null;
  if(!v){ melding('Kies een examen of een domein'); return }
  const titel = c ? 'Examen bedrijfseconomie '+exNaam(c) : 'Examenvragen '+DOMEINEN.find(x=>x.id===d).naam;
  const imgs=[...new Set(v.flatMap(x=>x.img||[]))];
  const w=window.open('','_blank'); if(!w){ melding('Sta pop-ups toe om te printen'); return }
  const L='ABCDE';
  w.document.write(`<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>${esc(titel)}</title><style>
   body{font:14px/1.45 Arial,sans-serif;color:#000;margin:24px} h1{font-size:20px} .v{break-inside:avoid;margin:0 0 18px} .v b{display:block}
   .ctx{color:#333;font-size:13px;margin:4px 0;white-space:pre-line} .o{margin-left:18px} img{width:100%;max-width:720px;display:block;margin:8px 0;break-inside:avoid}
   .pb{break-before:page} table{border-collapse:collapse} td,th{border:1px solid #999;padding:4px 10px}
   .knop{position:fixed;top:10px;right:10px;padding:10px 16px;font-size:16px} @media print{.knop{display:none}}</style></head><body>
   <button class="knop" onclick="print()">Printen</button><h1>${esc(titel)}</h1><p>Naam: ______________________ Klas: ______ </p>
   ${v.map((x,i)=>`<div class="v"><b>${i+1}. (${x.jaar} tv${x.tv}, vraag ${x.nr}${x.titel?' · '+esc(x.titel):''})</b>${x.ctx?`<div class="ctx">${esc(x.ctx)}</div>`:''}<div style="white-space:pre-line">${esc(x.q)}</div>${x.t==='open'?'<div style="height:90px;border-bottom:1px dotted #999"></div>':(x.o||[]).map((o,k)=>`<div class="o">${L[k]}&nbsp; ${esc(o)}</div>`).join('')}</div>`).join('')}
   <div class="pb"><h1>Examenpagina's en informatiebronnen</h1>${imgs.map(s=>`<p style="font-size:12px;margin:12px 0 0">${s.replace('-o-',' · examen p. ').replace('-b-',' · bijlage p. ')}</p><img src="${location.href.replace(/[^/]*$/,'')}${EX_IMG}${s}.jpg">`).join('')}</div>
   <div class="pb"><h1>Antwoordblad</h1><table><tr><th>Vraag</th><th>Antwoord</th></tr>${v.map((x,i)=>`<tr><td>${i+1}</td><td style="width:${antw&&x.t==='open'?'auto':'120px'};white-space:pre-line">${antw?(x.t==='open'?esc(x.model||''):L[x.a]):''}</td></tr>`).join('')}</table></div>
   </body></html>`);
  w.document.close();
}

// ===== Docentendashboard =====
// Haalt alle leerlingen op via de server (actie 'overzicht') en toont ze in tabbladen.
// Werkt ook met een oudere server: velden die ontbreken worden overgeslagen.
let dTab='overzicht', dSel=null, dWereld='alle';
const DOC_KEY='ecohv-docent';

SCHERMEN.docent = function(){
  let opgeslagen=''; try{ opgeslagen=sessionStorage.getItem(DOC_KEY)||'' }catch(e){}
  if(serverModus()&&opgeslagen&&!D) setTimeout(()=>laadDocent(opgeslagen),0);
  return `<div class="wrap" style="max-width:1200px">${kop('Docentendashboard','go(\'home\')')}
   ${D?'':`<div class="kaart" style="max-width:420px">
   ${serverModus()?`<label class="label" style="margin-top:0">Docentcode</label><input type="password" id="dCode" inputmode="numeric" onkeydown="if(event.key==='Enter')laadDocent()">
   <div class="voet"><button class="knop" onclick="laadDocent()">Open dashboard</button></div>`:`<p style="margin-top:0">Het klassenoverzicht werkt zodra de server is gekoppeld. Nu zie je alleen dit apparaat.</p><button class="knop" onclick="toonDocent({spelers:[samenvatLokaal()]})">Toon dit apparaat</button>`}</div>`}
   <div id="dOut"></div></div>`;
};

async function laadDocent(code){
  const c=code||($('#dCode')?$('#dCode').value.trim():'');
  if(!c){ melding('Vul je docentcode in'); return }
  const o=$('#dOut'); if(o) o.innerHTML='<p class="zacht">Gegevens ophalen…</p>';
  try{ const j=await api('overzicht',{docentcode:c}); try{sessionStorage.setItem(DOC_KEY,c)}catch(e){} toonDocent(j) }
  catch(e){ try{sessionStorage.removeItem(DOC_KEY)}catch(x){} if(o) o.innerHTML=''; melding(e.message,4000) }
}
function toonDocent(j){ D=j; D.opgehaald=Date.now(); go('docent'); tekenDocent() }
function dVernieuw(){ let c=''; try{c=sessionStorage.getItem(DOC_KEY)||''}catch(e){} if(c) laadDocent(c); else { D=null; go('docent') } }
function dUitloggen(){ try{sessionStorage.removeItem(DOC_KEY)}catch(e){} D=null; dSel=null; go('docent') }

// ---- berekeningen ----
const etPct = et => { if(!et||!et.r||et.r.length<3) return null; let a=0,w=0; et.r.forEach((x,i)=>{a+=x*(i+1);w+=i+1}); return Math.round(a/w*100) };
// levels met vragen; met een leerling erbij alleen de levels van zijn niveau (havo/vwo)
const dLvs = (w,s) => lvsVoor(w, s?niveauVan(s.klas):'').filter(speelbaar);
const dWerelden = () => WERELDEN.filter(w=>dLvs(w.id).length);
const alleLevels = s => dWerelden().flatMap(w=>dLvs(w.id,s).map(l=>({w:w.id,l})));
const bronsN = s => alleLevels(s).filter(x=>((s.lv||{})[x.l.id]||{}).best>=MEDAIL[0].min).length;
const diplomaN = s => Object.values(s.toets||{}).filter(t=>t.klaar).length;
const exBeheerst = (s,lijst) => (lijst||exVragen(niveauVan(s.klas))).filter(v=>{const r=(s.vr||{})[v.id]; return r&&r.g>0&&r.g>=r.f}).length;
const dagenSinds = t => t? Math.floor((Date.now()-t)/864e5) : null;
function laatsteWeken(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(Date.now()-i*7*864e5); out.push({id:weekId(d), l:'wk '+weekId(d).split('-W')[1].replace(/^0/,'')}) } return out }
function laatsteDagen(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(Date.now()-i*864e5); const id=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); out.push({id, l:String(d.getDate()), t:d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})}) } return out }
const kleurScore = v => v==null?'var(--lijn)':v>=75?'var(--goed)':v>=50?'var(--goud)':'var(--fout)';
const dc = v => v==null?'<span class="zacht">–</span>':`<b style="color:${kleurScore(v)}">${v}</b>`;
const datumKort = t => t? new Date(t).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) : '–';

// eenvoudige staafgrafiek (één reeks, minuten); tooltip via title
function staven(items, eenheid){
  const max=Math.max(1,...items.map(x=>x.v));
  return `<div style="display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;border-bottom:1px solid var(--lijn)">
   ${items.map(x=>`<div title="${esc(x.t||x.l)}: ${x.v} ${eenheid}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0">
     <span style="font-size:11px;color:var(--zacht);margin-bottom:2px">${x.v||''}</span>
     <div style="width:100%;max-width:38px;height:${Math.round(x.v/max*100)}%;min-height:${x.v?2:0}px;background:var(--acc);border-radius:4px 4px 0 0"></div></div>`).join('')}</div>
   <div style="display:flex;gap:6px">${items.map(x=>`<span style="flex:1;text-align:center;font-size:11px;color:var(--zacht);min-width:0;overflow:hidden;white-space:nowrap">${esc(x.l)}</span>`).join('')}</div>`;
}
function balk(v, label, extra){ return `<div class="domein"><span>${label}</span><div class="balk" title="${v==null?'nog geen score':v+'%'}"><i style="width:${v||0}%;background:${kleurScore(v)}"></i></div><span class="pct">${v==null?'–':v}</span></div>${extra||''}` }
const tegel = (getal, label, sub) => `<div class="kaart" style="padding:14px"><div style="font-size:28px;font-weight:800;line-height:1.1">${getal}</div><div style="font-weight:700;font-size:14px">${label}</div>${sub?`<div class="zacht" style="font-size:13px">${sub}</div>`:''}</div>`;

// ---- hoofdscherm ----
function tekenDocent(){
  const o=$('#dOut'); if(!o||!D) return;
  const klassen=[...new Set(D.spelers.map(s=>s.klas))].sort();
  const sp=D.spelers.filter(s=>dKlas==='alle'||s.klas===dKlas);
  const tabs=[['overzicht','Overzicht'],['klas','Klassikaal'],['leerlingen','Leerlingen'],['vragen','Vragen'],['eindtermen','Eindtermen'],['examen','Examentrainer']];
  const kopbalk=`<div class="voet" style="justify-content:flex-start;margin:0 0 12px;align-items:center">
    <select style="max-width:170px" onchange="dKlas=this.value;dSel=null;tekenDocent()"><option value="alle">Alle groepen</option>${klassen.map(k=>`<option ${k===dKlas?'selected':''}>${esc(k)}</option>`).join('')}</select>
    ${tabs.map(([k,t])=>`<button class="knop ${dTab===k&&!dSel?'':'zacht'}" style="min-height:44px;padding:8px 14px" onclick="dTab='${k}';dSel=null;tekenDocent()">${t}</button>`).join('')}
    <span style="flex:1"></span>
    <span class="zacht" style="font-size:13px">Opgehaald ${new Date(D.opgehaald||Date.now()).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</span>
    <button class="knop zacht" style="min-height:44px;padding:8px 14px" onclick="dVernieuw()">↻ Vernieuwen</button>
    <button class="knop zacht" style="min-height:44px;padding:8px 14px" onclick="dCsv()">CSV</button>
    <button class="knop zacht" style="min-height:44px;padding:8px 14px" onclick="window.print()">Afdrukken</button>
    <button class="knop zacht" style="min-height:44px;padding:8px 14px" onclick="dUitloggen()">Uitloggen</button></div>`;
  let inhoud;
  if(dSel){ const s=D.spelers.find(x=>x.id===dSel); inhoud=s?dLeerling(s):'' }
  else inhoud = {overzicht:dOverzicht,klas:dKlassikaal,leerlingen:dLeerlingen,vragen:dVragen,eindtermen:dEindtermen,examen:dExamen}[dTab](sp);
  o.innerHTML=kopbalk+(sp.length||dSel?inhoud:'<div class="kaart"><p class="zacht" style="margin:0">Nog geen leerlingen in deze groep.</p></div>');
}

function dOverzicht(sp){
  const n=sp.length, actief=sp.filter(s=>(s.tijdWeek||0)>0).length;
  const gemWeek=n?Math.round(sp.reduce((a,s)=>a+(s.tijdWeek||0),0)/n/60):0;
  const gemBrons=n?Math.round(sp.reduce((a,s)=>a+bronsN(s)/Math.max(1,alleLevels(s).length),0)/n*100):0;
  const dipl=sp.reduce((a,s)=>a+diplomaN(s),0);
  const heeftVr=sp.some(s=>s.vr); const exN=exVragen('').length;
  const gemEx=heeftVr&&n?Math.round(sp.reduce((a,s)=>a+exBeheerst(s),0)/n):null;
  const weken=laatsteWeken(8).map(w=>({l:w.l,t:'Week '+w.id.split('-W')[1],v:Math.round(sp.reduce((a,s)=>a+((s.week||{})[w.id]||0),0)/60)}));
  const dagen=laatsteDagen(14).map(d=>({l:d.l,v:Math.round(sp.reduce((a,s)=>a+((s.dag||{})[d.id]||0),0)/60)}));
  const heeftDag=sp.some(s=>s.dag&&Object.keys(s.dag).length);
  // aandacht
  const stil=sp.filter(s=>{const d=dagenSinds(s.laatst); return d==null||d>=7}).sort((a,b)=>(a.laatst||0)-(b.laatst||0));
  const zwak=[]; sp.forEach(s=>DOMEINEN.forEach(d=>{const v=(s.dom||{})[d.id]; if(v!=null&&v<50) zwak.push({s,d,v})})); zwak.sort((a,b)=>a.v-b.v);
  const veelHerhaal=sp.filter(s=>(s.herhaal||0)>=10).sort((a,b)=>b.herhaal-a.herhaal);
  const domGem=DOMEINEN.map(d=>{const l=sp.map(s=>(s.dom||{})[d.id]).filter(v=>v!=null); return {d,v:l.length?Math.round(l.reduce((a,b)=>a+b,0)/l.length):null,n:l.length}});
  const wereldStandKlas=dWerelden().map(w=>{const lv=dLvs(w.id); const pct=n?Math.round(sp.reduce((a,s)=>a+lv.filter(l=>((s.lv||{})[l.id]||{}).best>=MEDAIL[0].min).length,0)/(n*lv.length)*100):0; const dip=sp.filter(s=>((s.toets||{})[w.id]||{}).klaar).length; return {w,pct,dip}});
  const lnk=s=>`<a href="#" onclick="dSel='${esc(s.id)}';tekenDocent();return false" style="color:var(--acc);font-weight:700">${esc(s.naam)}</a>`;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px">
     ${tegel(n,'leerlingen',`${actief} actief deze week`)}
     ${tegel(gemWeek+' min','gem. oefentijd deze week','per leerling')}
     ${tegel(gemBrons+'%','levels brons of beter','gemiddeld over alle domeinen')}
     ${tegel(dipl,'diploma\'s behaald','eindtoetsen helemaal goed')}
     ${gemEx!=null&&exN?tegel(gemEx,'examenvragen beheerst','gemiddeld per leerling'):''}</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
    <div class="kaart"><b>Oefentijd van de groep per week</b> <span class="zacht" style="font-size:13px">(minuten, alle leerlingen samen)</span>${staven(weken,'min')}</div>
    ${heeftDag?`<div class="kaart"><b>Oefentijd per dag</b> <span class="zacht" style="font-size:13px">(laatste 14 dagen, minuten)</span>${staven(dagen,'min')}</div>`:''}
    <div class="kaart"><b>Gemiddelde score per domein</b>${domGem.map(x=>balk(x.v,x.d.icoon,'')).join('')}<p class="zacht" style="font-size:12px;margin:6px 0 0">${domGem.map(x=>`${x.d.icoon} ${x.d.naam} (${x.n} lln)`).join(' · ')}</p></div>
    <div class="kaart"><b>Voortgang per wereld</b> <span class="zacht" style="font-size:13px">(% levels brons · diploma's)</span>${wereldStandKlas.map(x=>`<div class="domein" style="grid-template-columns:34px 1fr 90px"><span>${x.w.icoon}</span><div class="balk" title="H${x.w.nr} ${esc(x.w.naam)}: ${x.pct}%"><i style="width:${x.pct}%;background:${x.w.kleur}"></i></div><span class="pct" style="font-weight:600;font-size:14px">${x.pct}% · 🎓${x.dip}</span></div>`).join('')}</div>
   </div>
   <div class="sectie">Aandacht nodig</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
    <div class="kaart"><b>Al een week niet geoefend</b>${stil.length?stil.slice(0,12).map(s=>`<div class="rij">${lnk(s)}<span style="flex:1"></span><span class="zacht" style="font-size:13px">${s.laatst?dagenSinds(s.laatst)+' dagen':'nooit'}</span></div>`).join(''):'<p class="zacht">Iedereen is deze week actief geweest.</p>'}</div>
    <div class="kaart"><b>Lage domeinscores (onder 50)</b>${zwak.length?zwak.slice(0,12).map(x=>`<div class="rij">${lnk(x.s)}<span style="flex:1;font-size:14px">${x.d.icoon} ${x.d.naam}</span>${dc(x.v)}</div>`).join(''):'<p class="zacht">Geen scores onder de 50.</p>'}</div>
    <div class="kaart"><b>Veel foute vragen open (10 of meer)</b>${veelHerhaal.length?veelHerhaal.slice(0,12).map(s=>`<div class="rij">${lnk(s)}<span style="flex:1"></span><span class="zacht" style="font-size:13px">${s.herhaal} in herhaalronde</span></div>`).join(''):'<p class="zacht">Niemand heeft een lange herhaallijst.</p>'}</div>
   </div>`;
}

// Klassikaal: per klas de onderwerpen waar de groep het zwakst op scoort, de vaakst foute vragen en de toetscijfers.
// Bedoeld om te kiezen wat je in de les nog eens klassikaal behandelt.
function dKlassikaal(sp){
  const klassen=[...new Set(sp.map(s=>s.klas))].sort();
  const lnk=s=>`<a href="#" onclick="dSel='${esc(s.id)}';tekenDocent();return false" style="color:var(--acc)">${esc(s.naam)}</a>`;
  const gem=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
  return klassen.map(k=>{ const l=sp.filter(s=>s.klas===k); const minN=Math.max(2,Math.ceil(l.length*0.25));
    const ond=Object.keys(EINDTERMEN).map(c=>{ const sc=l.map(s=>({s,v:etPct((s.et||{})[c])})).filter(x=>x.v!=null); return {c,n:sc.length,v:sc.length?Math.round(sc.reduce((a,x)=>a+x.v,0)/sc.length):null,laag:sc.filter(x=>x.v<50).map(x=>x.s)} })
      .filter(x=>x.n>=minN).sort((a,b)=>a.v-b.v).slice(0,6);
    const tel={}; l.forEach(s=>Object.entries(s.vr||{}).forEach(([id,r])=>{ if(id.startsWith('gen.')) return; const t=tel[id]||(tel[id]={g:0,f:0,ll:new Set()}); t.g+=r.g||0; t.f+=r.f||0; if(r.f) t.ll.add(s.id) }));
    const vr=Object.entries(tel).filter(([id,t])=>t.ll.size>=minN&&vraagById(id)).map(([id,t])=>({v:vraagById(id),t,p:Math.round(t.f/(t.g+t.f)*100)})).sort((a,b)=>b.t.ll.size-a.t.ll.size||b.p-a.p).slice(0,6);
    const pt={}; l.forEach(s=>Object.entries(s.pt||{}).forEach(([key,r])=>{ (pt[key]=pt[key]||[]).push(r.l!=null?r.l:r.b) }));
    const ptl=Object.entries(pt).map(([key,a])=>({key,n:a.length,c:gem(a)})).sort((a,b)=>a.c-b.c);
    const exr=l.flatMap(s=>Object.entries(s.exr||{}).map(([c,r])=>({s,c,r}))).sort((a,b)=>b.r.t-a.r.t);
    return `<div class="sectie">${esc(k)} · ${l.length} leerlingen</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
     <div class="kaart"><b>Zwakste onderwerpen van de klas</b> <span class="zacht" style="font-size:13px">(gemiddelde score, minstens ${minN} lln)</span>
      ${ond.length?ond.map(x=>`<div class="rij" style="display:block">${balk(x.v,`<span style="font-size:14px">${esc(EINDTERMEN[x.c].t)}</span>`).replace('class="domein"','class="domein" style="grid-template-columns:minmax(150px,1.3fr) 1fr 44px;border:0;padding:0"')}
        <div class="zacht" style="font-size:13px">${x.n} lln met score${x.laag.length?` · onder 50: ${x.laag.slice(0,8).map(lnk).join(', ')}${x.laag.length>8?' en '+(x.laag.length-8)+' meer':''}`:''}</div></div>`).join(''):'<p class="zacht">Nog te weinig gegevens.</p>'}</div>
     <div class="kaart"><b>Vragen die veel leerlingen fout hadden</b>
      ${vr.length?vr.map(x=>`<div class="rij" style="display:block"><b style="color:var(--fout)">${x.t.ll.size} lln fout</b> <span class="zacht" style="font-size:13px">· ${x.p}% van de pogingen fout · ${esc((EINDTERMEN[x.v.e]||{}).t||'')}</span><div style="font-size:14px;margin-top:2px">${esc(x.v.q.length>220?x.v.q.slice(0,220)+'…':x.v.q)}</div><div class="zacht" style="font-size:13px">Juist: ${esc(String(juistTekst(x.v)||'').slice(0,160))}</div></div>`).join(''):'<p class="zacht">Nog te weinig gegevens.</p>'}</div>
     <div class="kaart"><b>Proeftoetsen</b> <span class="zacht" style="font-size:13px">(gemiddeld laatste cijfer)</span>
      ${ptl.length?ptl.map(x=>`<div class="rij"><span style="flex:1;font-size:14px">${esc(x.key.split('|')[1])}</span><span class="zacht" style="font-size:13px">${x.n} lln</span><b style="min-width:40px;text-align:right;color:${x.c>=5.5?'var(--goed)':'var(--fout)'}">${String(x.c).replace('.',',')}</b></div>`).join(''):'<p class="zacht">Nog geen proeftoetsen gemaakt (of de server heeft de nieuwste Code.gs nog niet).</p>'}
      <div style="margin-top:12px"><b>Examens op tijd</b></div>
      ${exr.length?exr.slice(0,10).map(x=>`<div class="rij">${lnk(x.s)}<span style="flex:1;font-size:13px" class="zacht">${esc(exNaam(x.c))}</span><span style="font-size:13px">${x.r.p}/${x.r.m}</span><b style="min-width:40px;text-align:right;color:${x.r.cf>=5.5?'var(--goed)':'var(--fout)'}">${String(x.r.cf).replace('.',',')}</b></div>`).join(''):'<p class="zacht">Nog geen examens op tijd gemaakt.</p>'}</div>
    </div>`; }).join('')||'<div class="kaart"><p class="zacht" style="margin:0">Nog geen leerlingen.</p></div>';
}

function dLeerlingen(sp){
  const exN=exVragen('').length;
  const rijen=sp.map(s=>({s,totLv:alleLevels(s).length,brons:bronsN(s),dipl:diplomaN(s),ex:s.vr?exBeheerst(s):null}));

  const etRijen=DOMEINEN.map(d=>{ const codes=Object.keys(EINDTERMEN).filter(k=>EINDTERMEN[k].d===d.id); const r=codes.map(k=>({k,v:etPct((s.et||{})[k]),n:((s.et||{})[k]||{}).n||0})).filter(x=>x.n);

  const fout=Object.entries(s.vr||{}).filter(([k,r])=>!k.startsWith('gen.')&&r.f>0).map(([k,r])=>({k,r,v:vraagById(k)})).filter(x=>x.v).sort((a,b)=>(b.r.f-b.r.g)-(a.r.f-a.r.g)||b.r.f-a.r.f).slice(0,10);
  const foutOud=!s.vr&&s.fout?Object.entries(s.fout).filter(([k])=>!k.startsWith('gen.')).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,f])=>({k,r:{f,g:0},v:vraagById(k)})).filter(x=>x.v):[];
  const exRijen=exN&&s.vr?exLijst(niveauVan(s.klas)).map(({c,v})=>{const b=exBeheerst(s,v); const gemaakt=v.filter(x=>(s.vr||{})[x.id]).length; return `<div class="domein" style="grid-template-columns:150px 1fr 70px;font-size:14px"><span>${exNaam(c)}</span><div class="balk" title="${gemaakt} gemaakt, ${b} beheerst"><i style="width:${Math.round(b/v.length*100)}%"></i></div><span class="pct">${b}/${v.length}</span></div>`}).join(''):'';

  const wereldOpt=[['alle','Alle werelden']].concat(dWerelden().map(w=>[w.id,w.nr+' '+w.naam]),exVragen('').length?[['ex','Examenvragen']]:[]);

  lijst.forEach(x=>x.p=Math.round(x.t.f/(x.t.g+x.t.f)*100)); lijst.sort((a,b)=>b.p-a.p||b.t.f-a.t.f);

  const gl=Object.entries(rekengen).filter(([k,t])=>t.g+t.f>=3).map(([k,t])=>({k,t,p:Math.round(t.f/(t.g+t.f)*100),voorb:(()=>{try{return maakGen(k.slice(4)).q}catch(e){return k}})()})).sort((a,b)=>b.p-a.p).slice(0,12);
  return `<div class="voet" style="justify-content:flex-start;margin:0 0 10px"><select style="max-width:300px" onchange="dWereld=this.value;tekenDocent()">${wereldOpt.map(([k,t])=>`<option value="${k}" ${k===dWereld?'selected':''}>${esc(t)}</option>`).join('')}</select></div>

     <div style="margin-top:4px">${esc(x.v.q)}</div><div class="zacht" style="font-size:14px">Juist: ${esc(juistTekst(x.v))} · ${esc(x.v.w==='ex'?'Examen '+x.v.jaar+' tv'+x.v.tv+' vraag '+x.v.nr:(WERELDEN.find(w=>w.id===x.v.w)||{}).naam||'')} · ${esc((EINDTERMEN[x.v.e]||{}).t||'')}</div></div>`).join(''):'<p class="zacht">Nog te weinig gegevens.</p>'}</div>
   ${gl.length&&dWereld==='alle'?`<div class="sectie">Rekensommen met wisselende getallen</div><div class="kaart">${gl.map(x=>`<div class="rij"><b style="min-width:52px;color:${kleurScore(100-x.p)}">${x.p}% fout</b><span style="flex:1;font-size:14px">${esc(x.voorb)}</span><span class="zacht" style="font-size:13px">${x.t.f+x.t.g} pogingen</span></div>`).join('')}</div>`:''}`;

// ---------- 1. Flitskaarten ----------
// Leitner-systeem: elke kaart zit in een bak (0 t/m 6). Wist je hem, dan gaat hij een bak verder en komt hij later terug.
// S.fk[begrip] = [bak, tijdstip waarop hij weer aan de beurt is] (een array, zodat de server de nieuwste versie houdt)
const FK_INT=[0,1,3,7,14,30,60];
function alleBegrippen(d){ const out=[], gezien=new Set(); wereldenVoor().forEach(w=>{ if(d&&d!==w.id) return; const b=(LEVELS[w.id]||{}).begrippen||{};
  Object.keys(b).forEach(k=>{ if(!gezien.has(k)){ gezien.add(k); out.push({k,def:b[k],w:w.id}) } }) }); return out }
function fkStaat(){ if(!S.fk||Array.isArray(S.fk)) S.fk={}; return S.fk }
function fkDue(d){ const fk=fkStaat(), nu=Date.now(); return alleBegrippen(d).filter(x=>fk[x.k]&&fk[x.k][1]<=nu) }
function fkNieuw(d){ const fk=fkStaat(); return shuffle(alleBegrippen(d).filter(x=>!fk[x.k])).sort((a,b)=>(S.kaarten.includes(b.k)?1:0)-(S.kaarten.includes(a.k)?1:0)) }
let FK=null, fkOm=false;
function startFlits(d){ const due=shuffle(fkDue(d)).slice(0,30); const nw=fkNieuw(d).slice(0,Math.max(0,Math.min(10,30-due.length)));
  const lijst=due.concat(nw); if(!lijst.length){ melding('Hier zijn nu geen kaarten om te oefenen'); return }
  FK={d,lijst,i:0,om:false,ok:0,bijna:0,nee:0}; go('flitsen') }
SCHERMEN.flits = function(){
  const fk=fkStaat();
  const rij=(d,naam,ic)=>{ const al=alleBegrippen(d); if(!al.length) return ''; const due=fkDue(d).length, nw=al.filter(x=>!fk[x.k]).length, vast=al.filter(x=>fk[x.k]&&fk[x.k][0]>=4).length;
    return `<button class="lv" onclick="startFlits(${d?`'${d}'`:''})"><span class="med">${ic}</span><span style="flex:1"><b>${esc(naam)}</b><small>${due?`<b style="color:var(--fout)">${due} om te herhalen</b> · `:''}${nw} nieuw · ${vast} van ${al.length} zitten vast</small><div class="balk" style="margin-top:6px"><i style="width:${Math.round(vast/al.length*100)}%"></i></div></span><span class="zacht">›</span></button>` };
  return `<div class="wrap" style="max-width:760px">${kop('Flitskaarten',"go('leren')")}
   <div class="kaart" style="margin-bottom:14px"><p style="margin:0">Je ziet een begrip. Bedenk de betekenis, draai de kaart om en zeg eerlijk of je hem wist. Kaarten die je weet komen later terug (na 1, 3, 7, 14, 30 en 60 dagen), kaarten die je niet weet komen meteen nog een keer.</p>
   <label class="label" style="margin-top:10px"><input type="checkbox" ${fkOm?'checked':''} onchange="fkOm=this.checked"> Andersom oefenen: je ziet de betekenis en noemt het begrip</label></div>
   <div class="kaart">${rij('','Alle werelden door elkaar','🃏')}${wereldenVoor().filter(w=>Object.keys((LEVELS[w.id]||{}).begrippen||{}).length).map(w=>rij(w.id,w.lab+' · '+w.naam,w.icoon)).join('')}</div></div>${VOET()}`;
};
SCHERMEN.flitsen = function(){
  if(!FK) return SCHERMEN.flits();
  const x=FK.lijst[FK.i]; const voor=fkOm?x.def:x.k, achter=fkOm?x.k:x.def; const W=WERELDEN.find(w=>w.id===x.w)||{};
  return `<div class="wrap" style="max-width:640px"><div class="top" style="display:flex;align-items:center;gap:10px;margin:8px 0 14px"><button class="terug" onclick="fkKlaar()">‹ Stop</button><b style="flex:1">Flitskaarten</b><span class="chip">${FK.i+1} / ${FK.lijst.length}</span></div>
   <button class="flitskaart ${FK.om?'om':''}" style="--k:${W.kleur||'var(--acc)'}" onclick="fkDraai()"><small>${esc(W.icoon||'')} ${esc(W.naam||x.w)} · ${fkOm?'Welk begrip is dit?':'Wat betekent dit begrip?'}</small>
    <span class="voor">${esc(voor)}</span>${FK.om?`<span class="achter">${esc(achter)}</span>`:'<span class="zacht" style="font-size:14px">Tik om de kaart om te draaien</span>'}</button>
   ${FK.om?`<div class="fkknoppen"><button class="knop zacht" onclick="fkAntw(0)">✘ Wist ik niet</button><button class="knop zacht" onclick="fkAntw(1)">≈ Twijfel</button><button class="knop" onclick="fkAntw(2)">✔ Wist ik</button></div>`:''}</div>`;
};
function fkDraai(){ if(!FK||FK.om) return; FK.om=true; go('flitsen') }
function fkAntw(s){
  const x=FK.lijst[FK.i], fk=fkStaat(), r=fk[x.k]||[0,0], nu=Date.now();
  if(s===2){ const b=Math.min(r[0]+1,6); fk[x.k]=[b,nu+FK_INT[b]*DAG]; FK.ok++; S.xp+=2; if(!S.kaarten.includes(x.k)) S.kaarten.push(x.k) }
  else if(s===1){ fk[x.k]=[Math.max(1,r[0]),nu+DAG]; FK.bijna++ }
  else { fk[x.k]=[0,nu]; FK.nee++; x.n=(x.n||0)+1; if(x.n<3) FK.lijst.push(x) }
  FK.i++; FK.om=false; bewaar(false);
  if(FK.i>=FK.lijst.length) fkKlaar(); else go('flitsen');
}
function fkKlaar(){ if(!FK) return go('flits'); const f=FK; FK=null; bewaar(); checkBadges();
  if(!f.ok&&!f.bijna&&!f.nee) return go('flits');
  go('flits'); melding(`Klaar: ${f.ok} gekend, ${f.bijna} twijfel, ${f.nee} nog niet. Morgen weer even herhalen!`,4500) }

// ---------- 3. Grafiekvragen: break-evengrafiek, klik op een punt, lijn of gebied ----------
// TO = p·Q en TK = C + v·Q (Q × 1.000 stuks, bedragen × € 1.000). De leerling klikt; we rekenen in SVG-pixels.
const GR={x0:52,y0:250,w:294,h:226};
function grafBev(){
  const Qe=pick([30,40,50,60]), p=pick([10,12,15,20,25]), db=pick([0.4,0.5,0.6])*p, v=p-db, C=Qe*db;
  const Qmax=Math.ceil(Qe*1.8/10)*10, Ymax=Math.ceil(p*Qmax/50)*50;
  return {Qe,p,v,C,Qmax,Ymax} }
const grafPt=(m,q,y)=>[GR.x0+q/m.Qmax*GR.w, GR.y0-y/m.Ymax*GR.h];
function grafSvg(m,extra,opts){ opts=opts||{};
  const sx=q=>GR.x0+q/m.Qmax*GR.w, sy=y=>GR.y0-y/m.Ymax*GR.h;
  const lijn=(f,kl,lab,stip)=>{ const a=[sx(0),sy(f(0))], b=[sx(m.Qmax),sy(f(m.Qmax))];
    return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${kl}" stroke-width="3" ${stip?'stroke-dasharray="7 5"':''}/>${lab&&!opts.zonderLabel?`<text x="${b[0]-4}" y="${b[1]-6}" text-anchor="end" font-size="13" font-weight="700" fill="${kl}">${lab}</text>`:''}` };
  const ystap=m.Ymax/5; let raster=''; for(let y=ystap;y<=m.Ymax+0.01;y+=ystap) raster+=`<line x1="${GR.x0}" x2="${GR.x0+GR.w}" y1="${sy(y)}" y2="${sy(y)}" class="rast"/><text x="${GR.x0-6}" y="${sy(y)+4}" text-anchor="end" font-size="11" class="as">${gt(y)}</text>`;
  const stap=m.Qmax>100?20:10; for(let q=stap;q<=m.Qmax;q+=stap) raster+=`<line y1="${GR.y0}" y2="${GR.y0-GR.h}" x1="${sx(q)}" x2="${sx(q)}" class="rast"/><text x="${sx(q)}" y="${GR.y0+15}" text-anchor="middle" font-size="11" class="as">${q}</text>`;
  const lijnen=lijn(q=>m.p*q,'#2f7de0','TO')+lijn(q=>m.C+m.v*q,'#e07a2f','TK')+(opts.ck?lijn(()=>m.C,'#7a4fd6','TCK',true):'');
  return `<svg id="graf" viewBox="0 0 360 280" onclick="grafKlik(event)" role="img" aria-label="Break-evengrafiek">${raster}
   <line x1="${GR.x0}" y1="${GR.y0}" x2="${GR.x0+GR.w+6}" y2="${GR.y0}" class="ax"/><line x1="${GR.x0}" y1="${GR.y0}" x2="${GR.x0}" y2="${GR.y0-GR.h-8}" class="ax"/>
   <text x="${GR.x0+4}" y="${GR.y0-GR.h-10}" font-size="12" class="as">€ (× 1.000)</text><text x="${GR.x0+GR.w}" y="${GR.y0+28}" font-size="12" text-anchor="end" class="as">afzet (× 1.000 stuks)</text>
   ${lijnen}${extra||''}<g id="grafOpl"></g><g id="grafMark"></g></svg>`;
}
function inDriehoek(p,a,b,c){ const s=(p1,p2,p3)=>(p1[0]-p3[0])*(p2[1]-p3[1])-(p2[0]-p3[0])*(p1[1]-p3[1]); const d1=s(p,a,b),d2=s(p,b,c),d3=s(p,c,a); return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0)) }
const dichtbij=(p,q,r)=>Math.hypot(p[0]-q[0],p[1]-q[1])<=(r||16);
const oplPunt=(xy)=>`<circle cx="${xy[0]}" cy="${xy[1]}" r="9" fill="none" stroke="var(--goed)" stroke-width="3"/>`;
const oplVlak=(pts)=>`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="color-mix(in srgb,var(--goed) 35%,transparent)" stroke="var(--goed)" stroke-width="2"/>`;
const bevTxt=m=>`TO = ${nl1(m.p).replace(/,0$/,'')}Q en TK = ${gt(m.C)} + ${nl1(m.v).replace(/,0$/,'')}Q (bedragen × € 1.000, Q × 1.000 stuks)`;
Object.assign(GENS,{
  grafBreakEven(){ const m=grafBev(); const e=grafPt(m,m.Qe,m.p*m.Qe);
    return {t:'klik',e:'F.breakeven',q:'Hieronder zie je de totale opbrengst (TO) en de totale kosten (TK) van een onderneming. Klik op het break-evenpunt.',svg:grafSvg(m),raak:p=>dichtbij(p,e),opl:oplPunt(e),
      juist:`het snijpunt van TO en TK (afzet ${m.Qe}.000 stuks)`,u:`In het break-evenpunt is TO = TK, dus het resultaat is nul. Hier: ${bevTxt(m)}. Break-evenafzet = ${gt(m.C)} / (${nl1(m.p)} − ${nl1(m.v)}) = ${m.Qe} (× 1.000).`} },
  grafWinst(){ const m=grafBev(); const a=grafPt(m,m.Qe,m.p*m.Qe),b=grafPt(m,m.Qmax,m.p*m.Qmax),c=grafPt(m,m.Qmax,m.C+m.v*m.Qmax);
    return {t:'klik',e:'F.breakeven',q:'Klik in het gebied waar de onderneming winst maakt.',svg:grafSvg(m),raak:p=>inDriehoek(p,a,b,c),opl:oplVlak([a,b,c]),
      juist:'het gebied tussen TO en TK rechts van het break-evenpunt',u:'Rechts van het break-evenpunt ligt TO boven TK: elke extra verkochte eenheid levert de dekkingsbijdrage op, de constante kosten zijn al gedekt.'} },
  grafVerlies(){ const m=grafBev(); const a=grafPt(m,0,0),b=grafPt(m,0,m.C),c=grafPt(m,m.Qe,m.p*m.Qe);
    return {t:'klik',e:'F.breakeven',q:'Klik in het gebied waar de onderneming verlies maakt.',svg:grafSvg(m),raak:p=>inDriehoek(p,a,b,c),opl:oplVlak([a,b,c]),
      juist:'het gebied tussen TK en TO links van het break-evenpunt',u:'Links van het break-evenpunt ligt TK boven TO: de dekkingsbijdragen zijn nog niet genoeg om de constante kosten te dekken.'} },
  grafCK(){ const m=grafBev(); const xy=grafPt(m,0,m.C);
    return {t:'klik',e:'F.kosten',q:'Klik op het punt in de grafiek dat de totale constante kosten aangeeft.',svg:grafSvg(m),raak:p=>dichtbij(p,xy,18),opl:oplPunt(xy),
      juist:`het snijpunt van TK met de verticale as (€ ${gt(m.C)}.000)`,u:'Bij een afzet van 0 zijn er geen variabele kosten. De TK-lijn begint dus op de hoogte van de constante kosten.'} },
  grafLijn(){ const m=grafBev(); const to=Math.random()<.5; const f=to?(q=>m.p*q):(q=>m.C+m.v*q);
    const raak=p=>{ for(let q=0;q<=m.Qmax;q+=m.Qmax/200){ if(dichtbij(p,grafPt(m,q,f(q)),12)) return true } return false };
    const a=grafPt(m,0,f(0)), b=grafPt(m,m.Qmax,f(m.Qmax)); const opl=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--goed)" stroke-width="7" opacity=".5"/>`;
    return {t:'klik',e:'F.breakeven',q:`De namen staan er niet bij. Klik op de lijn van de ${to?'totale opbrengst (TO)':'totale kosten (TK)'}.`,svg:grafSvg(m,'',{zonderLabel:true}),raak,opl,
      juist:to?'de lijn die in de oorsprong begint':'de lijn die boven de oorsprong begint (bij de constante kosten)',u:to?'Zonder verkoop is er geen opbrengst: TO begint in (0, 0) en loopt steiler omhoog.':'Ook zonder productie zijn er constante kosten: TK begint op de hoogte van de constante kosten.'} },
  grafResultaat(){ const m=grafBev(); const q=pick([m.Qe-10,m.Qe+10,m.Qe+20].filter(x=>x>0&&x<=m.Qmax)); const a=r2((m.p-m.v)*q-m.C);
    const xs=grafPt(m,q,0); const st=`<line x1="${xs[0]}" x2="${xs[0]}" y1="${GR.y0}" y2="${GR.y0-GR.h}" stroke="#d64f7a" stroke-width="2" stroke-dasharray="6 5"/>`;
    return {t:'reken',e:'F.breakeven',q:`${bevTxt(m)}. De onderneming verkoopt ${q}.000 stuks. Bereken het resultaat in duizenden euro's (verlies is negatief).`,a,eh:'',
      u:`Resultaat = (${nl1(m.p)} − ${nl1(m.v)}) × ${q} − ${gt(m.C)} = ${nl1(a)} (× € 1.000). Je kunt het ook aflezen: het verschil tussen TO en TK bij ${q}.000 stuks.`} }
});
const GRAF_GENS=['grafBreakEven','grafWinst','grafVerlies','grafCK','grafLijn','grafResultaat'];
function grafKlik(ev){ if(!Q||Q.fase!=='vraag') return; const v=Q.vragen[Q.i]; if(v.t!=='klik') return;

   <div class="kaart">${exLijst().map(({c})=>{ const l=exvVragen(c); const x=r[c]; const bezig=S.exvol&&S.exvol.c===c;

  c=c||(S.exvol||{}).c; const l=exvVragen(c||''); if(!l.length) return `<div class="wrap">${kop('Examen op tijd',"go('examen')")}<div class="kaart"><p style="margin:0">Dit examen is niet gevonden.</p></div></div>`;

function foutGroepen(vr, herhaal){

    if(!v||!v.e) return; const open=herhaal&&!v.gen?herhaal.includes(id):r.f>(r.g||0);
    (g[v.e]=g[v.e]||{e:v.e,items:[]}).items.push({id,v,r,open}) });
  return Object.values(g).map(x=>{ x.items.sort((a,b)=>(b.open-a.open)||(b.r.f-a.r.f)); x.open=x.items.filter(i=>i.open).length; x.tot=x.items.length; return x })
    .sort((a,b)=>b.open-a.open||b.tot-a.tot);
}

// ===== Werkplaats: oefeningen in een schema, zoals op de uitwerkbijlage van het examen =====
// Nieuwe vraagvorm t:'schema'. Een vraag heeft kop (kolomkoppen), rij (rijen met cellen) en eventueel pre (html boven het schema,
// bijvoorbeeld een tijdlijn of organogram). Een cel is tekst, {n:getal, tol} (getal invullen) of {s:[keuzes], a:'juiste keuze'}.
// Alle invulcellen moeten goed zijn. Alle oefeningen zijn generatoren: elke keer nieuwe getallen.

const _cellen = v => v.rij.flatMap(r=>r.c).filter(c=>c&&typeof c==='object');
function schemaHtml(v){
  let k=0; antw=_cellen(v).map(()=> '');
  const cel=c=>{ if(c==null||typeof c!=='object') return `<td>${esc(c==null?'':String(c))}</td>`; const i=k++;
    if(c.s) return `<td><select data-k="${i}" onchange="schemaIn(this)"><option value="">Kies…</option>${c.s.map(o=>`<option>${esc(o)}</option>`).join('')}</select></td>`;
    return `<td><input type="text" inputmode="decimal" autocomplete="off" data-k="${i}" oninput="schemaIn(this)" placeholder="${c.ph||''}"></td>` };
  return `${v.pre?`<div class="schemaPre">${v.pre}</div>`:''}<div class="vtabel schema"><table>${v.kop?`<tr>${v.kop.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>`:''}${v.rij.map(r=>`<tr><th scope="row">${esc(r.l)}</th>${r.c.map(cel).join('')}</tr>`).join('')}</table></div>
   <p class="zacht" style="font-size:14px">${v.tip||'Vul alles in. Bedragen in hele euro\'s, zonder punt of €-teken mag ook.'}</p>`;
}
function schemaIn(el){ antw[+el.dataset.k]=el.value.trim(); $('#ok').disabled=antw.some(x=>x==='') }
function celGoed(c,x){ if(c.s) return x===c.a; const g=parseGetal(x); return !isNaN(g)&&Math.abs(g-c.n)<=(c.tol!=null?c.tol:1.01) }
const celTxt = c => c.s ? c.a : (c.tol==null||c.tol>=1 ? gt(Math.round(c.n)) : String(r2(c.n)).replace('.',','));
const _nakijkenS=nakijken; nakijken=function(v,a){ if(v.t==='schema') return Array.isArray(a)&&_cellen(v).every((c,i)=>celGoed(c,a[i])); return _nakijkenS(v,a) };
const _juistS=juistTekst; juistTekst=function(v){ if(v.t!=='schema') return _juistS(v);
  return v.rij.map(r=>{ const c=r.c.filter(x=>x&&typeof x==='object'); return c.length?`${r.l}: ${c.map(celTxt).join(' / ')}`:'' }).filter(Boolean).join(' · ') };
const _tekenS=tekenVraag; tekenVraag=function(){ _tekenS(); const v=Q.vragen[Q.i];
  if(v.t==='schema'){ $('#fb').insertAdjacentHTML('beforebegin',schemaHtml(v)) } };
const _afrondenS=afronden; afronden=function(v){
  if(v.t==='schema'&&!Q.geenFb&&Q.modus!=='toets'){ const cs=_cellen(v);

      if(!ok) el.insertAdjacentHTML('afterend',`<small class="juist">${esc(celTxt(c))}</small>`) }) }

// ---------- helpers ----------
const kiesN=(arr,n)=>shuffle(arr.slice()).slice(0,n);
const rond=(x,s)=>Math.round(x/s)*s;

Object.assign(GENS,{
  // 1. Balans invullen: posten indelen en het eigen vermogen berekenen (vierkantscontrole)
  balansInvullen(){
    const A=[['Gebouw','Vaste activa',[150,400]],['Inventaris','Vaste activa',[15,60]],['Machines','Vaste activa',[40,120]],['Bestelbus','Vaste activa',[20,45]],
      ['Voorraad goederen','Vlottende activa',[20,90]],['Debiteuren','Vlottende activa',[8,40]],['Kas','Liquide middelen',[1,5]],['Bank','Liquide middelen',[5,30]]];
    const P=[['Hypothecaire lening','Lang vreemd vermogen',[100,250]],['Onderhandse lening','Lang vreemd vermogen',[20,60]],['Crediteuren','Kort vreemd vermogen',[10,45]],['Rekening-courantkrediet','Kort vreemd vermogen',[5,25]]];
    const keuze=['Vaste activa','Vlottende activa','Liquide middelen','Lang vreemd vermogen','Kort vreemd vermogen'];
    const posten=kiesN(A,5).concat(kiesN(P,2)).map(([n,c,[lo,hi]])=>({n,c,b:rond(lo*1000+Math.random()*(hi-lo)*1000,500)}));
    const act=posten.filter(p=>!p.c.includes('vermogen')).reduce((s,p)=>s+p.b,0), vv=posten.filter(p=>p.c.includes('vermogen')).reduce((s,p)=>s+p.b,0);
    if(act-vv<20000) posten.find(p=>p.c==='Vaste activa').b+=vv-act+rond(40000+Math.random()*60000,1000);
    const totA=posten.filter(p=>!p.c.includes('vermogen')).reduce((s,p)=>s+p.b,0), ev=totA-vv;
    const naam=pick(['Fietsenzaak Trapper','Bakkerij De Korenaar','Webwinkel Boxx','Sportzaak Vlam','Tuincentrum Groenrijk']);
    return {t:'schema', e:'A.balans', q:`Hieronder staan de balansposten van ${naam} op 1 januari. Geef bij elke post aan waar hij op de balans hoort. Bereken daarna het eigen vermogen.`,
      kop:['Post','Bedrag','Plaats op de balans'], rij:shuffle(posten).map(p=>({l:p.n,c:[eur(p.b),{s:keuze,a:p.c}]})).concat([{l:'Eigen vermogen',c:['?',{n:ev,ph:'€'}]},{l:'Balanstotaal',c:['',{n:totA,ph:'€'}]}]),
      u:`Debet: vaste activa, vlottende activa en liquide middelen (samen ${eur(totA)}). Credit: eigen vermogen en vreemd vermogen. Eigen vermogen = ${gt(totA)} − ${gt(vv)} = ${eur(ev)}. Vierkantscontrole: debet = credit = ${eur(totA)}.`} },

  // 2. Balansmutaties: welke posten veranderen er?
  balansMutatie(){
    const P=['Inventaris','Voorraad','Debiteuren','Kas','Bank','Eigen vermogen','Lening','Crediteuren'];
    const b=rond(500+Math.random()*9500,100), b2=rond(b*pick([0.5,0.6,0.7]),10);
    const E=[[`Inkoop van goederen op rekening, ${eur(b)}.`,{Voorraad:'+',Crediteuren:'+'}],[`Betaling aan een leverancier via de bank, ${eur(b)}.`,{Crediteuren:'−',Bank:'−'}],
      [`Een klant betaalt een openstaande factuur via de bank, ${eur(b)}.`,{Debiteuren:'−',Bank:'+'}],[`Er wordt ${eur(b)} contant geld op de bank gestort.`,{Kas:'−',Bank:'+'}],
      [`Aflossing op de lening via de bank, ${eur(b)}.`,{Lening:'−',Bank:'−'}],[`De eigenaar neemt ${eur(b)} contant op voor privé.`,{Kas:'−','Eigen vermogen':'−'}],
      [`Afschrijving op de inventaris, ${eur(b)}.`,{Inventaris:'−','Eigen vermogen':'−'}],[`Het loon van ${eur(b)} wordt via de bank betaald.`,{Bank:'−','Eigen vermogen':'−'}],
      [`Aankoop van een nieuwe toonbank (inventaris) op rekening, ${eur(b)}.`,{Inventaris:'+',Crediteuren:'+'}],[`De interest over de lening, ${eur(b)}, wordt via de bank betaald.`,{Bank:'−','Eigen vermogen':'−'}],
      [`De eigenaar stort ${eur(b)} extra privégeld op de zakelijke bankrekening.`,{Bank:'+','Eigen vermogen':'+'}],
      [`Contante verkoop van goederen voor ${eur(b)}. De inkoopwaarde van deze goederen is ${eur(b2)}.`,{Kas:'+',Voorraad:'−','Eigen vermogen':'+'}],
      [`Verkoop op rekening voor ${eur(b)}. De inkoopwaarde is ${eur(b2)}.`,{Debiteuren:'+',Voorraad:'−','Eigen vermogen':'+'}]];
    const [txt,eff]=pick(E);
    return {t:'schema', e:'A.balans', q:`Gebeurtenis: ${txt}\nGeef bij elke balanspost aan of hij stijgt (+), daalt (−) of gelijk blijft.`, kop:['Balanspost','Verandering'],
      rij:P.map(p=>({l:p,c:[{s:['+','−','gelijk'],a:eff[p]||'gelijk'}]})), tip:'Elke gebeurtenis verandert minstens twee posten. Vraag je af: verandert er iets aan het eigen vermogen (winst, kosten, privé)?',
      u:`Er veranderen: ${Object.entries(eff).map(([k,x])=>k+' '+x).join(', ')}. De balans blijft in evenwicht.`} },

  // 3a. Kosten of uitgave?
  kostenUitgaven(){
    const L=[['Afschrijving op de bestelbus','alleen kosten'],['Aflossing van de banklening','alleen uitgave'],['Loon van december, betaald in december','kosten én uitgave'],
      ['Aankoop van een machine, contant betaald','alleen uitgave'],['Huur voor dit jaar, dit jaar betaald','kosten én uitgave'],['Interest over dit jaar, pas volgend jaar betaald','alleen kosten'],
      ['Verzekeringspremie voor volgend jaar, nu al betaald','alleen uitgave'],['Privé-opname door de eigenaar','geen van beide'],['Inkoop van goederen die nog op voorraad liggen, contant betaald','alleen uitgave'],
      ['Energierekening van dit jaar, dit jaar betaald','kosten én uitgave']];
    const k=kiesN(L,5);
    return {t:'schema', e:'F.perio', q:'Een handelsonderneming maakt de resultatenrekening en het liquiditeitsoverzicht over dit jaar. Geef bij elke post aan of het (voor dit jaar) kosten zijn, een uitgave, allebei of geen van beide.', kop:['Post','Soort'],
      rij:k.map(([l,a])=>({l,c:[{s:['kosten én uitgave','alleen kosten','alleen uitgave','geen van beide'],a}]})), tip:'Kosten = waardeverbruik in de periode. Uitgave = geld gaat de onderneming uit.',
      u:'Afschrijving is kosten maar geen uitgave. Aflossen en investeren zijn uitgaven maar geen kosten. Een privé-opname is geen kosten (en geen bedrijfsuitgave).'} },

  // 3b. Liquiditeitsbegroting invullen
  liquiditeitsbegroting(){
    const mnd=['januari','februari','maart']; const pc=pick([40,50,60]); const om=[0,0,0].map(()=>rond(20000+Math.random()*20000,1000)); const deb=rond(8000+Math.random()*8000,500);
    const ink=pick([50,60]); const vast=rond(6000+Math.random()*4000,500); const begin=rond(2000+Math.random()*6000,500); const aflos=pick([0,0,2000,3000]);
    let s=begin; const rij=[];
    om.forEach((o,i)=>{ const ontv=o*pc/100+(i===0?deb:om[i-1]*(100-pc)/100); const uitg=o*ink/100+vast+(i===1?aflos:0); s=s+ontv-uitg; rij.push({l:mnd[i],c:[eur(o),{n:ontv,ph:'€'},{n:uitg,ph:'€'},{n:s,ph:'€'}]}) });
    return {t:'schema', e:'A.liquid', q:`Stel de liquiditeitsbegroting op voor het eerste kwartaal.\n- Beginsaldo liquide middelen op 1 januari: ${eur(begin)}.\n- ${pc}% van de omzet wordt contant ontvangen, de rest een maand later. Op 1 januari staat er ${eur(deb)} aan debiteuren open, die in januari betalen.\n- De inkopen zijn ${ink}% van de omzet en worden in dezelfde maand betaald.\n- Overige uitgaven: ${eur(vast)} per maand.${aflos?`\n- In februari wordt ${eur(aflos)} afgelost op een lening.`:''}\nEen tekort vul je in met een minteken.`,
      kop:['Maand','Omzet','Ontvangsten','Uitgaven','Eindsaldo'], rij,
      u:`Ontvangsten = contant deel van deze maand + rest van vorige maand. Uitgaven = inkopen + overige uitgaven${aflos?' (+ aflossing in februari)':''}. Eindsaldo = beginsaldo + ontvangsten − uitgaven; het eindsaldo is het beginsaldo van de volgende maand.`} },

  // 3c. Resultatenbegroting invullen
  resultatenbegroting(){
    const q=rond(4000+Math.random()*8000,100), p=pick([25,30,40,45,60]), iw=pick([40,50,55,60]); const om=q*p, ivo=om*iw/100;
    const loon=rond(30000+Math.random()*30000,1000), huur=rond(12000+Math.random()*12000,600); const A=rond(40000+Math.random()*40000,1000), R=rond(A*0.1,1000), n=pick([4,5,8]); const af=(A-R)/n;
    const L=rond(50000+Math.random()*50000,5000), i=pick([4,5,6]); const int=L*i/100; const res=om-ivo-loon-huur-af-int;
    return {t:'schema', e:'A.balans', q:`Maak de resultatenbegroting (paginavorm) voor volgend jaar.\n- Verwachte afzet ${gt(q)} stuks, verkoopprijs ${eur(p)} per stuk.\n- De inkoopwaarde is ${iw}% van de omzet.\n- Loonkosten ${eur(loon)}, huur ${eur(huur)}.\n- Inventaris: aanschafwaarde ${eur(A)}, restwaarde ${eur(R)}, levensduur ${n} jaar (lineair).\n- Lening ${eur(L)} tegen ${i}% interest per jaar.`,
      kop:['Post','Bedrag'], rij:[{l:'Omzet',c:[{n:om}]},{l:'Inkoopwaarde van de omzet',c:[{n:ivo}]},{l:'Brutoresultaat',c:[{n:om-ivo}]},{l:'Afschrijvingskosten',c:[{n:af}]},{l:'Interestkosten',c:[{n:int}]},{l:'Resultaat voor belasting',c:[{n:res}]}],
      u:`Omzet ${gt(q)} × ${p} = ${eur(om)}. IWvO ${iw}% = ${eur(ivo)}. Brutoresultaat ${eur(om-ivo)}. Afschrijving (${gt(A)} − ${gt(R)}) / ${n} = ${eur(af)}. Interest ${eur(int)}. Resultaat = ${gt(om-ivo)} − ${gt(loon)} − ${gt(huur)} − ${gt(af)} − ${gt(int)} = ${eur(res)}.`} },

  // 4. Tijdlijn: contante waarde van losse bedragen (en NCW)
  tijdlijnCW(){
    const i=pick([3,4,5,6,8]), n=pick([3,4]); const ncw=Math.random()<.5; const I=ncw?rond(40000+Math.random()*60000,5000):0;
    const B=Array.from({length:n},()=>rond(ncw?I/n*pick([1.05,1.1,1.2,1.3]):1000+Math.random()*9000,500));
    const cw=B.map((b,t)=>b/Math.pow(1+i/100,t+1)); const tot=cw.reduce((a,b)=>a+b,0);
    const W=520,x=t=>40+t*(W-80)/n; const svg=`<svg viewBox="0 0 ${W} 110" class="tijdlijn" role="img" aria-label="Tijdlijn"><line x1="30" y1="60" x2="${W-20}" y2="60" class="ax"/>${Array.from({length:n+1},(_,t)=>`<line x1="${x(t)}" x2="${x(t)}" y1="52" y2="68" class="ax"/><text x="${x(t)}" y="86" text-anchor="middle" font-size="13" class="as">t = ${t}</text>`).join('')}
      ${ncw?`<text x="${x(0)}" y="40" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700">−${gt(I)}</text>`:''}${B.map((b,t)=>`<text x="${x(t+1)}" y="40" text-anchor="middle" font-size="13" fill="#1f9e6e" font-weight="700">+${gt(b)}</text>`).join('')}<text x="${W/2}" y="104" text-anchor="middle" font-size="12" class="as">jaren · interest ${i}% per jaar</text></svg>`;
    const rij=B.map((b,t)=>({l:`${eur(b)} op t = ${t+1}`,c:[`${gt(b)} × ${pc(1+i/100)}^−${t+1}`,{n:cw[t]}]})).concat([{l:'Totale contante waarde',c:['',{n:tot}]}]);
    if(ncw) rij.push({l:'Netto contante waarde',c:[`totaal − ${gt(I)}`,{n:tot-I}]},{l:'Advies',c:['',{s:['investeren','niet investeren'],a:tot-I>0?'investeren':'niet investeren'}]});
    return {t:'schema', e:ncw?'D.invest':'B.interest', pre:svg, q:ncw?`Een onderneming overweegt een investering van ${eur(I)} (op t = 0). De verwachte cashflows staan op de tijdlijn; ze komen aan het eind van elk jaar vrij. De vermogenskostenvoet is ${i}%. Bereken de netto contante waarde en geef een advies.`:`Je ontvangt de bedragen op de tijdlijn aan het eind van elk jaar. De interest is ${i}% per jaar. Bereken van elk bedrag de contante waarde op t = 0 en tel ze op.`,
      kop:['Bedrag','Berekening','Contante waarde'], rij, tip:'Rond af op hele euro\'s. Een negatieve uitkomst vul je in met een minteken.',
      u:`Elk bedrag reken je terug met (1 + i)⁻ᵗ, waarbij t het aantal jaren tot nu is. Totaal ${eur(tot)}${ncw?`; NCW = ${gt(tot)} − ${gt(I)} = ${eur(tot-I)}: ${tot-I>0?'positief, dus investeren':'negatief, dus niet investeren'}`:''}.`} },

  // 5. Aflossingstabel (lineair of annuïteit)
  aflossingstabel(){
    const ann=Math.random()<.4; const L=rond(20000+Math.random()*80000,ann?1000:4000), i=pick([4,5,6]), n=4; const A=ann?r2(L*(i/100)/(1-Math.pow(1+i/100,-n))):0;
    let s=L; const rij=[];
    for(let j=1;j<=n;j++){ const int=r2(s*i/100), afl=ann?r2(A-int):L/n, eind=r2(s-afl); rij.push({l:`Jaar ${j}`,c:[j===1?eur(s):{n:s},{n:int},{n:afl},{n:Math.abs(eind)<1?0:eind}]}); s=eind }
    return {t:'schema', e:ann?'B.wonen':'B.interest', q:ann?`Een lening van ${eur(L)} wordt in ${n} jaar afgelost met een annuïteit van ${eur(A)} per jaar, aan het eind van elk jaar. De interest is ${i}%. Vul de aflossingstabel in.`:`Een lening van ${eur(L)} wordt in ${n} jaar lineair afgelost, aan het eind van elk jaar. De interest is ${i}% per jaar over de schuld aan het begin van het jaar. Vul de aflossingstabel in.`,
      kop:['Jaar','Schuld begin','Interest','Aflossing','Schuld eind'], rij, tip:'Rond af op hele euro\'s.',
      u:ann?'Interest = schuld begin × i. Aflossing = annuïteit − interest. Het aflossingsdeel stijgt elk jaar, het interestdeel daalt.':`Aflossing = ${gt(L)} / ${n} = ${eur(L/n)} per jaar. Interest = ${i}% van de schuld aan het begin van het jaar, dus elk jaar lager.`} },

  // 6. Verschillenanalyse in een schema
  verschillenSchema(){
    const sp=pick([2,2.5,4,5,8]), sh1=pick([3,4,5,6]), W=rond(4000+Math.random()*6000,100); const SH=sh1*W; const WH=rond(SH*pick([0.96,0.98,1.02,1.03,1.05]),10); const WP=r2(sp*pick([0.95,0.97,1.03,1.05,1.08]));
    const C=rond(80000+Math.random()*80000,1000), N=rond(W*pick([0.9,0.95,1.05,1.1]),100);
    const pr=(sp-WP)*WH, ef=(SH-WH)*sp, bz=(W-N)*C/N; const vn=x=>x>=0?'voordelig':'nadelig';
    return {t:'schema', e:'F.versch', q:`Een fabriek maakt tuinstoelen. Per stoel is standaard ${sh1} kg kunststof nodig à ${eur(sp)} per kg (standaardprijs).\nDit jaar zijn ${gt(W)} stoelen gemaakt. Er is ${gt(WH)} kg kunststof verbruikt, gekocht voor ${eur(WP)} per kg.\nDe constante kosten zijn ${eur(C)} bij een normale productie van ${gt(N)} stoelen.\nBereken de resultaten en geef aan of ze voordelig of nadelig zijn.`,
      kop:['Resultaat','Bedrag (positief)','Voordelig of nadelig'], rij:[{l:'Prijsresultaat',c:[{n:Math.abs(pr)},{s:['voordelig','nadelig'],a:vn(pr)}]},{l:'Efficiencyresultaat',c:[{n:Math.abs(ef)},{s:['voordelig','nadelig'],a:vn(ef)}]},{l:'Bezettingsresultaat',c:[{n:Math.abs(bz)},{s:['voordelig','nadelig'],a:vn(bz)}]}],
      tip:'Vul het bedrag zonder minteken in en kies daarna voordelig of nadelig. Rond af op hele euro\'s.',
      u:`Prijsresultaat = (SP − WP) × WH = (${nl1(sp)} − ${nl1(WP)}) × ${gt(WH)} = ${eur(pr)}. Efficiencyresultaat = (SH − WH) × SP = (${gt(SH)} − ${gt(WH)}) × ${nl1(sp)} = ${eur(ef)}. Bezettingsresultaat = (W − N) × C/N = (${gt(W)} − ${gt(N)}) × ${nl1(C/N)} = ${eur(bz)}.`} },

  // 7. Organogram: spanwijdte, spandiepte, lijn en staf
  organogram(){
    const afd=kiesN(['Inkoop','Verkoop','Productie','Logistiek','Marketing','Financiën','ICT'],pick([2,3,4]));
    const staf=pick(['Juridisch adviseur','P&O-adviseur','Secretariaat','Controller']);
    const team=afd.map(()=>pick([2,3,4,5])); const sub=Math.random()<.5?Math.floor(Math.random()*afd.length):-1;
    const W=560, bw=Math.min(120,(W-20)/afd.length-12), y=[20,100,180,250];
    const box=(x,yy,t,st)=>`<rect x="${x-bw/2}" y="${yy}" width="${bw}" height="30" rx="6" class="obox${st?' staf':''}"/><text x="${x}" y="${yy+19}" text-anchor="middle" font-size="11">${esc(t)}</text>`;
    const xs=afd.map((_,k)=>(k+0.5)*W/afd.length);
    let g=box(W/2,y[0],'Directeur')+`<line x1="${W/2+bw/2}" y1="${y[0]+15}" x2="${W-bw-4}" y2="${y[0]+15}" class="olijn" stroke-dasharray="5 4"/>`+box(W-bw/2-4,y[0],staf,true);
    g+=`<line x1="${W/2}" y1="${y[0]+30}" x2="${W/2}" y2="${y[1]-12}" class="olijn"/><line x1="${xs[0]}" y1="${y[1]-12}" x2="${xs[xs.length-1]}" y2="${y[1]-12}" class="olijn"/>`;
    afd.forEach((a,k)=>{ g+=`<line x1="${xs[k]}" y1="${y[1]-12}" x2="${xs[k]}" y2="${y[1]}" class="olijn"/>`+box(xs[k],y[1],'Hoofd '+a.toLowerCase());
      g+=`<line x1="${xs[k]}" y1="${y[1]+30}" x2="${xs[k]}" y2="${y[2]}" class="olijn"/>`+box(xs[k],y[2],`${team[k]} medewerkers`);
      if(k===sub) g+=`<line x1="${xs[k]}" y1="${y[2]+30}" x2="${xs[k]}" y2="${y[3]}" class="olijn"/>`+box(xs[k],y[3],'2 stagiairs'); });
    const svg=`<svg viewBox="0 0 ${W} ${sub>=0?290:220}" class="organo" role="img" aria-label="Organogram">${g}</svg>`;
    const k=Math.floor(Math.random()*afd.length); const diepte=sub>=0?4:3;
    return {t:'schema', e:'C.org', pre:svg, q:`Hieronder staat het organogram van een middelgrote onderneming. De medewerkers in een vakje vallen allemaal direct onder hun hoofd${sub>=0?'; de stagiairs vallen onder één medewerker van die afdeling':''}. Beantwoord de vragen.`,
      kop:['Vraag','Antwoord'], rij:[{l:'Spanwijdte van de directeur (aantal direct ondergeschikten in de lijn)',c:[{n:afd.length,tol:0.01}]},{l:`Spanwijdte van het hoofd ${afd[k].toLowerCase()}`,c:[{n:team[k],tol:0.01}]},{l:'Spandiepte (aantal niveaus in de lijn)',c:[{n:diepte,tol:0.01}]},{l:`De ${staf.toLowerCase()} is een`,c:[{s:['lijnfunctie','staffunctie'],a:'staffunctie'}]},{l:'Organisatievorm',c:[{s:['lijnorganisatie','lijn-staforganisatie'],a:'lijn-staforganisatie'}]}],
      tip:'Spanwijdte = aantal mensen dat direct onder één leidinggevende valt. Spandiepte = aantal hiërarchische niveaus.',
      u:`De directeur heeft ${afd.length} afdelingshoofden direct onder zich. Het hoofd ${afd[k].toLowerCase()} heeft ${team[k]} medewerkers. Er zijn ${diepte} niveaus. De ${staf.toLowerCase()} adviseert zonder bevoegdheid in de lijn (stippellijn): een staffunctie, dus een lijn-staforganisatie.`} }
});

SCHERMEN.werkplaats=function(){

   <div class="kaart" style="margin-bottom:6px"><p style="margin:0">Oefenen zoals op de uitwerkbijlage van het examen: schema's invullen, tabellen afmaken en rekenen op een tijdlijn. Elke keer nieuwe getallen. Je krijgt 4 opgaven per ronde.</p></div>
   <div class="kaart">${WERKPLAATS.map(([ic,t,s,g])=>`<button class="uitdaging" onclick="startWerk('${g}')"><span class="thumb" style="background:var(--bg);display:grid;place-items:center;font-size:28px">${ic}</span><span><b>${t}</b><small>${s}</small></span></button>`).join('')}</div></div>${VOET()}`;
};
const _lerenW=SCHERMEN.leren; SCHERMEN.leren=function(){ return _lerenW().replace('<div class="kaart">',`<div class="kaart"><button class="uitdaging" onclick="go('werkplaats')"><span class="thumb" style="background:var(--bg);display:grid;place-items:center;font-size:28px">🛠️</span><span><b>Werkplaats</b><small>Balans, begrotingen, tijdlijn, aflossingstabel, verschillenanalyse en organogram invullen</small></span></button>`) };

start();
</script>
